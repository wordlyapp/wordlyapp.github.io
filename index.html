<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly AI – Premium Duolingo Style</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-hover: #46a302;
            --duo-green-shadow: #3b8201;
            --duo-light-green: #f4ffd7;
            --duo-dark: #2b2b2b;
            --duo-gray-text: #777777;
            --bg: #ffffff;
            --card-bg: #ffffff;
            --border: #e5e5e5;
            --accent-blue: #1cb0f6;
            --accent-blue-shadow: #1899d6;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            color: var(--duo-dark);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Navigation */
        header.top-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            border-bottom: 2px solid var(--border);
            background: white;
            z-index: 100;
        }

        .logo-area {
            font-size: 24px;
            font-weight: 900;
            color: var(--duo-green);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Language Pair Switcher UI */
        .lang-switcher {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f7f7f7;
            border: 2px solid var(--border);
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 13px;
        }

        .lang-switcher select {
            background: transparent;
            border: none;
            font-weight: 800;
            font-size: 13px;
            color: var(--duo-dark);
            outline: none;
            cursor: pointer;
        }

        .flag-icon {
            width: 22px;
            height: 16px;
            border-radius: 3px;
            object-fit: cover;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        .top-stats-bar {
            display: flex;
            gap: 10px;
        }

        .stat-pill {
            background: #f7f7f7;
            border: 2px solid var(--border);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 800;
            color: #4b4b4b;
        }

        .reset-btn {
            background: #fee2e2;
            color: #dc2626;
            border: 2px solid #fecaca;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .reset-btn:hover { background: #fecaca; }

        /* Workspace */
        main.workspace {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 16px;
            background: #ffffff;
        }

        .content-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Chapter Tabs & Header */
        .chapter-header {
            width: 100%;
            text-align: center;
            margin-bottom: 24px;
        }
        .chapter-header h2 { font-size: 24px; font-weight: 900; color: #3c3c3c; margin-bottom: 4px; }
        .chapter-header p { color: var(--duo-gray-text); font-size: 14px; font-weight: 700; }

        .chapter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
            width: 100%;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .chapter-tab {
            flex: 1;
            padding: 10px 14px;
            background: #f7f7f7;
            border: 2px solid var(--border);
            border-bottom: 4px solid var(--border);
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 13px;
            color: var(--duo-gray-text);
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
            white-space: nowrap;
        }

        .chapter-tab.active {
            background: var(--duo-light-green);
            border-color: var(--duo-green);
            border-bottom-color: var(--duo-green-shadow);
            color: var(--duo-green);
        }

        /* Path Styling */
        .duo-path {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            padding: 10px 0 40px 0;
        }

        .path-row {
            display: flex;
            justify-content: center;
            width: 100%;
            gap: 70px;
        }

        .path-row.offset-1 { transform: translateX(-40px); }
        .path-row.offset-2 { transform: translateX(40px); }

        .duo-node {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: var(--duo-green);
            border: none;
            border-bottom: 6px solid var(--duo-green-shadow);
            color: white;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
        }

        .duo-node span.node-label { font-size: 9px; opacity: 0.9; text-transform: uppercase; margin-top: 2px; }

        .duo-node:hover:not(.locked) { transform: scale(1.08); filter: brightness(1.05); }
        .duo-node:active:not(.locked) { transform: translateY(4px); border-bottom-width: 2px; box-shadow: 0 2px 0 rgba(0,0,0,0.08); }

        .duo-node.locked {
            background: #e5e5e5;
            border-bottom: 6px solid #d1d1d1;
            color: #afafaf;
            cursor: not-allowed;
            box-shadow: none;
        }

        .duo-node.current {
            animation: pulseNode 2s infinite;
        }

        @keyframes pulseNode {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(88, 204, 2, 0.5); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 14px rgba(88, 204, 2, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(88, 204, 2, 0); }
        }

        /* Lesson Card UI */
        .card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.04);
            width: 100%;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lesson-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #f7f7f7;
            border: 2px solid var(--border);
            border-bottom: 4px solid var(--border);
            color: var(--duo-gray-text);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
        }
        .back-btn:hover { background: #eee; }

        .progress-bar-container {
            flex: 1;
            height: 14px;
            background: #e5e5e5;
            border-radius: 10px;
            margin: 0 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--duo-green);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .question-title {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 20px;
            color: #3c3c3c;
            line-height: 1.4;
        }

        /* Buttons & Options */
        .btn {
            background-color: var(--duo-green);
            color: white;
            border: none;
            border-bottom: 5px solid var(--duo-green-shadow);
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 900;
            border-radius: var(--radius-sm);
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(88, 204, 2, 0.3);
        }

        .btn:hover { filter: brightness(1.05); }
        .btn:active { transform: translateY(3px); border-bottom-width: 2px; box-shadow: none; }

        .option-btn {
            background: white;
            color: var(--duo-dark);
            border: 2px solid var(--border);
            border-bottom: 4px solid var(--border);
            margin: 10px 0;
            text-align: left;
            box-shadow: none;
            text-transform: none;
            font-weight: 800;
            font-size: 15px;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
        }
        .option-btn:hover { background: #f7f7f7; border-color: #cfcfcf; }
        .option-btn.selected {
            background: #ddf4ff;
            border-color: var(--accent-blue);
            border-bottom-color: var(--accent-blue-shadow);
            color: #0484c7;
        }

        /* Builder Elements */
        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 14px 0;
            padding: 16px;
            background: #f7f7f7;
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            min-height: 70px;
            align-content: flex-start;
        }

        .word-bubble {
            background: white;
            border: 2px solid var(--border);
            border-bottom: 4px solid var(--border);
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }
        .word-bubble:hover { background: #f0f0f0; border-color: #ccc; }
        .word-bubble:active { transform: translateY(2px); border-bottom-width: 2px; }

        .target-slot {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 10px 0;
            padding: 16px;
            background: #ffffff;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            min-height: 70px;
            align-content: center;
        }

        /* Feedbacks */
        .feedback-box-correct {
            color: #278500; font-weight: 900; font-size: 15px; margin: 12px 0; padding: 14px;
            background: var(--duo-light-green); border-radius: var(--radius-sm); border: 2px solid #b8f270;
        }
        .feedback-box-wrong {
            color: #ea2b2b; font-weight: 900; font-size: 15px; margin: 12px 0; padding: 14px;
            background: #ffdfe0; border-radius: var(--radius-sm); border: 2px solid #ffb1b3;
        }

        .hidden { display: none !important; }

        /* Custom Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .custom-modal {
            background: white;
            padding: 28px;
            border-radius: var(--radius-lg);
            border: 2px solid var(--border);
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .custom-modal h3 { font-size: 20px; font-weight: 900; margin-bottom: 8px; color: #3c3c3c; }
        .custom-modal p { color: var(--duo-gray-text); font-size: 14px; font-weight: 700; margin-bottom: 24px; }
    </style>
</head>
<body>

    <!-- Notification Modal -->
    <div id="custom-notification" class="modal-overlay hidden">
        <div class="custom-modal">
            <h3 id="notif-title">Melding</h3>
            <p id="notif-text">Tekst...</p>
            <button class="btn" onclick="closeNotification()" style="margin-top: 0;">Begrepen</button>
        </div>
    </div>

    <!-- Top Nav -->
    <header class="top-nav">
        <div class="logo-area">
            🟢 Wordly AI
        </div>
        <div class="nav-controls">
            <!-- Taal Naar Taal Wisselaar -->
            <div class="lang-switcher">
                <span>Leer:</span>
                <img id="from-flag" class="flag-icon" src="" alt="">
                <select id="from-lang-select" onchange="changeLanguagePair()">
                    <option value="nl">Nederlands</option>
                    <option value="en">Engels</option>
                    <option value="ru">Russisch</option>
                    <option value="es">Spaans</option>
                </select>
                <span>➔</span>
                <img id="to-flag" class="flag-icon" src="" alt="">
                <select id="to-lang-select" onchange="changeLanguagePair()">
                    <option value="en">Engels</option>
                    <option value="ru">Russisch</option>
                    <option value="es">Spaans</option>
                    <option value="de">Duits</option>
                    <option value="fr">Frans</option>
                    <option value="nl">Nederlands</option>
                </select>
            </div>

            <div class="top-stats-bar">
                <div class="stat-pill">🔥 <span id="streak-display">1</span></div>
                <div class="stat-pill">⚡ <span id="points-display">0</span> XP</div>
            </div>
            <button class="reset-btn" onclick="resetProgressPrompt()">Reset</button>
        </div>
    </header>

    <!-- Workspace -->
    <main class="workspace">
        <div class="content-container">

            <!-- Dashboard / Leerpad -->
            <div id="page-dashboard" style="width: 100%;">
                <div class="chapter-header">
                    <h2 id="chapter-title-display">Hoofdstuk 1: Basis & Introductie</h2>
                    <p id="chapter-desc-display">Leer fundamentele woorden en simpele zinnen.</p>
                </div>

                <!-- Hoofdstuk Navigatie Tabbladen -->
                <div class="chapter-tabs" id="chapter-tabs-container">
                    <!-- Wordt dynamisch gevuld (10 hoofdstukken) -->
                </div>

                <div class="duo-path" id="path-container"></div>
            </div>

            <!-- Lessen / Vragen Scherm -->
            <div id="page-lesson" class="card page-section hidden">
                <div class="lesson-top-bar">
                    <button class="back-btn" onclick="backToDashboard()">✕ Stoppen</button>
                    <div class="progress-bar-container">
                        <div id="lesson-progress-bar" class="progress-bar-fill"></div>
                    </div>
                    <span id="lesson-progress-text" style="font-weight: 800; color: var(--duo-gray-text); font-size: 13px;">1/8</span>
                </div>
                <h3 id="question-prompt" class="question-title">Vertaal dit</h3>
                
                <div id="answers-area"></div>
                
                <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Doorgaan</button>
            </div>

            <!-- Voltooid Scherm -->
            <div id="page-complete" class="card page-section hidden" style="text-align: center;">
                <h2 style="font-size: 26px; font-weight: 900; color: var(--duo-green); margin-bottom: 10px;">Les Voltooid! 🎉</h2>
                <p id="complete-text" style="color: var(--duo-gray-text); font-size: 15px; font-weight: 700; margin-bottom: 24px;">Geweldig gepresteerd!</p>
                <button class="btn" onclick="backToDashboard()">Doorgaan</button>
            </div>

        </div>
    </main>

    <script>
        const flags = {
            nl: "https://flagcdn.com/w40/nl.png",
            en: "https://flagcdn.com/w40/gb.png",
            ru: "https://flagcdn.com/w40/ru.png",

        // Uitgebreide woordenschat per talenpaar en per thema/hoofdstuk
        const dictionaryDatabase = {

                [{ q: "Boek / Книга / Libro", a: "Book", type: "mc", opts: ["Pen", "Book", "Paper", "Desk"] }],
                [{ q: "Rood / Красный / Rojo", a: "Red", type: "mc", opts: ["Blue", "Red", "Green", "Yellow"] }],
                [{ q: "Groot / Большой / Grande", a: "Big", type: "mc", opts: ["Small", "Big", "Fast", "Slow"] }],
                [{ q: "Tijd / Время / Tiempo", a: "Time", type: "mc", opts: ["Day", "Time", "Night", "Hour"] }]
            ]
        };

        const chapterNames = [
            "Hoofdstuk 1: Basis & Introductie",
            "Hoofdstuk 2: Eten & Drinken",
            "Hoofdstuk 3: Reizen & Vervoer",
            "Hoofdstuk 4: Familie & Mensen",
            "Hoofdstuk 5: Huis & Omgeving",
            "Hoofdstuk 6: Kleuren & Cijfers",
            "Hoofdstuk 7: Dieren in de Natuur",
            "Hoofdstuk 8: Hobby's & Sport",
            "Hoofdstuk 9: School & Werk",
            "Hoofdstuk 10: Tijd & Weer"
        ];

        const chapterDescriptions = [
            "Leer fundamentele woorden en simpele begroetingen.",
            "Alles over lekker eten, drinken en boodschappen doen.",
            "Vervoermiddelen, stations en reizen naar het buitenland.",
            "Familieleden, vrienden en relaties beschrijven.",
            "Kamers, meubels en je eigen woning.",
            "De mooiste kleuren en getallen tellen.",
            "Dieren in het wild en huisdieren.",
            "Sporten, games spelen en ontspanning.",
            "Nuttige woorden voor op school en tijdens je werk.",
            "Het weer vandaag en besef van tijd."
        ];

        let appData = JSON.parse(localStorage.getItem('wordly_ai_v4')) || {
            points: 0,
            streak: 1,
            fromLang: "nl",
            toLang: "en",
            activeChapter: 0,
            completed: {}
        };

        function saveData() {
            localStorage.setItem('wordly_ai_v4', JSON.stringify(appData));
        }

        window.onload = function() {
            document.getElementById('from-lang-select').value = appData.fromLang;
            document.getElementById('to-lang-select').value = appData.toLang;
            updateFlags();
            renderChapterTabs();
            updateDashboardStats();
            renderPath();
        };

        function updateFlags() {
            document.getElementById('from-flag').src = flags[appData.fromLang] || flags.nl;
            document.getElementById('to-flag').src = flags[appData.toLang] || flags.en;
        }

        function changeLanguagePair() {
            appData.fromLang = document.getElementById('from-lang-select').value;
            appData.toLang = document.getElementById('to-lang-select').value;
            updateFlags();
            saveData();
            renderPath();
        }

        function updateDashboardStats() {
            document.getElementById('points-display').innerText = appData.points;
            document.getElementById('streak-display').innerText = appData.streak;
            document.getElementById('chapter-title-display').innerText = chapterNames[appData.activeChapter];
            document.getElementById('chapter-desc-display').innerText = chapterDescriptions[appData.activeChapter];
        }

        function renderChapterTabs() {
            let container = document.getElementById('chapter-tabs-container');
            container.innerHTML = "";
            for(let i = 0; i < 10; i++) {
                let tab = document.createElement('button');
                tab.className = `chapter-tab ${appData.activeChapter === i ? 'active' : ''}`;
                tab.innerText = `H${i+1}`;
                tab.onclick = () => {
                    appData.activeChapter = i;
                    saveData();
                    updateDashboardStats();
                    renderPath();
                };
                container.appendChild(tab);
            }
        }

        function getActiveQuestionsList() {
            let pairKey = `${appData.fromLang}-${appData.toLang}`;
            let chapters = dictionaryDatabase[pairKey] || dictionaryDatabase["nl-en"];
            return chapters[appData.activeChapter] || chapters[0];
        }

        function renderPath() {
            renderChapterTabs();
            let container = document.getElementById('path-container');
            container.innerHTML = "";
            
            let questionsPool = getActiveQuestionsList();
            let totalLessonsInChapter = 6; // 6 lessen per hoofdstuk
            let pattern = [1, 2, 1, 2, 1, 2];
            let langCompleted = appData.completed[`${appData.fromLang}-${appData.toLang}_ch${appData.activeChapter}`] || [];

            for(let i = 0; i < totalLessonsInChapter; i++) {
                let row = document.createElement('div');
                row.className = `path-row offset-${i % 3}`;

                let isDone = langCompleted.includes(i);
                let isUnlocked = i === 0 || langCompleted.includes(i - 1);

                let node = document.createElement('button');
                node.className = `duo-node ${isDone ? 'done' : (!isUnlocked ? 'locked' : 'current')}`;
                if(isDone) node.style.background = "var(--duo-green)";
                node.innerHTML = `${i + 1}<span class="node-label">Les</span>`;
                
                if(isUnlocked) {
                    node.onclick = () => startLesson(i, questionsPool);
                }

                row.appendChild(node);
                container.appendChild(row);
            }
        }

        let activeQuestions = [], currentQIdx = 0, activeLessonIdx = 0, currentLessonErrors = 0;

        function startLesson(lessonIdx, pool) {
            activeLessonIdx = lessonIdx;
            // Genereer 5 tot 6 vragen per les op basis van de pool
            activeQuestions = [];
            for(let q = 0; q < 5; q++) {
                let base = pool[(lessonIdx + q) % pool.length];
                activeQuestions.push(base);
            }
            currentQIdx = 0;
            currentLessonErrors = 0;
            
            document.querySelectorAll('#page-dashboard, #page-lesson, #page-complete').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-lesson').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            if(currentQIdx >= activeQuestions.length) {
                appData.points += 20;
                let key = `${appData.fromLang}-${appData.toLang}_ch${appData.activeChapter}`;
                if(!appData.completed[key]) appData.completed[key] = [];
                if(!appData.completed[key].includes(activeLessonIdx)) {
                    appData.completed[key].push(activeLessonIdx);
                }
                saveData();
                updateDashboardStats();

                document.querySelectorAll('#page-dashboard, #page-lesson, #page-complete').forEach(p => p.classList.add('hidden'));
                document.getElementById('page-complete').classList.remove('hidden');
                document.getElementById('complete-text').innerText = `Les ${activeLessonIdx + 1} succesvol afgerond in ${chapterNames[appData.activeChapter]}!`;
                return;
            }

            let qObj = activeQuestions[currentQIdx];
            let progressPercent = (currentQIdx / activeQuestions.length) * 100;
            document.getElementById('lesson-progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('lesson-progress-text').innerText = `${currentQIdx + 1}/${activeQuestions.length}`;
            document.getElementById('question-prompt').innerText = `Vertaal / Beantwoord: "${qObj.q}"`;

            let area = document.getElementById('answers-area');
            area.innerHTML = "";
            document.getElementById('next-btn').classList.add('hidden');

            if(qObj.type === 'mc') {
                let shuffledOpts = [...qObj.opts].sort(() => 0.5 - Math.random());
                shuffledOpts.forEach(opt => {
                    let btn = document.createElement('button');
                    btn.className = "btn option-btn";
                    btn.innerText = opt;
                    btn.onclick = () => checkMcAnswer(opt, qObj.a);
                    area.appendChild(btn);
                });
            } else if(qObj.type === 'builder') {
                renderSentenceBuilder(qObj);
            }
        }

        function renderSentenceBuilder(qObj) {
            let area = document.getElementById('answers-area');
            let selectedWords = [];
            let shuffledWords = [...qObj.words].sort(() => 0.5 - Math.random());

            area.innerHTML = `
                <div style="font-size:13px; color:var(--duo-gray-text); margin-bottom:6px; font-weight:800;">Jouw zin:</div>
                <div id="target-slot" class="target-slot"></div>
                <div style="font-size:13px; color:var(--duo-gray-text); margin-bottom:6px; margin-top:14px; font-weight:800;">Beschikbare woorden:</div>
                <div id="word-bank" class="word-bank"></div>
                <div id="builder-feedback"></div>
            `;

            let slotDiv = document.getElementById('target-slot');
            let bankDiv = document.getElementById('word-bank');

            function updateUI() {
                slotDiv.innerHTML = "";
                bankDiv.innerHTML = "";

                if(selectedWords.length === 0) {
                    slotDiv.innerHTML = `<span style="color:#b8b8b8; font-size:13px; font-weight:700;">Klik op de woorden hieronder...</span>`;
                }

                selectedWords.forEach((item, idx) => {
                    let bubble = document.createElement('div');
                    bubble.className = "word-bubble";
                    bubble.style.borderColor = "var(--accent-blue)";
                    bubble.style.background = "#ddf4ff";
                    bubble.style.color = "#0484c7";
                    bubble.innerText = item.word;
                    bubble.onclick = () => {
                        selectedWords.splice(idx, 1);
                        updateUI();
                    };
                    slotDiv.appendChild(bubble);
                });

                shuffledWords.forEach((w, idx) => {
                    let usedCount = selectedWords.filter(s => s.originalIdx === idx).length;
                    if(usedCount === 0) {
                        let bubble = document.createElement('div');
                        bubble.className = "word-bubble";
                        bubble.innerText = w;
                        bubble.onclick = () => {
                            selectedWords.push({ word: w, originalIdx: idx });
                            updateUI();
                        };
                        bankDiv.appendChild(bubble);
                    }
                });
            }

            updateUI();

            let checkBtn = document.createElement('button');
            checkBtn.className = "btn";
            checkBtn.innerText = "Controleer";
            checkBtn.style.marginTop = "16px";
            checkBtn.onclick = () => {
                let userSentence = selectedWords.map(s => s.word).join(" ");
                let correctSentence = qObj.words.join(" ");

                if(userSentence.toLowerCase() === correctSentence.toLowerCase()) {
                    document.getElementById('builder-feedback').innerHTML = `<div class="feedback-box-correct">Helemaal juist! Uitstekend werk.</div>`;
                    checkBtn.classList.add('hidden');
                    document.getElementById('next-btn').classList.remove('hidden');
                } else {
                    currentLessonErrors++;
                    document.getElementById('builder-feedback').innerHTML = `<div class="feedback-box-wrong">Niet helemaal. Juiste zin: <strong>${correctSentence}</strong></div>`;
                    checkBtn.classList.add('hidden');
                    document.getElementById('next-btn').classList.remove('hidden');
                }
            };
            area.appendChild(checkBtn);
        }

        function checkMcAnswer(given, correct) {
            let area = document.getElementById('answers-area');
            area.querySelectorAll('button').forEach(b => b.disabled = true);

            if(given.toLowerCase() === correct.toLowerCase()) {
                area.innerHTML += `<div class="feedback-box-correct">Geweldig! Dat is correct.</div>`;
            } else {
                currentLessonErrors++;
                area.innerHTML += `<div class="feedback-box-wrong">Helaas! Het juiste antwoord was: <strong>${correct}</strong></div>`;
            }
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQIdx++;
            loadQuestion();
        }

        function backToDashboard() {
            updateDashboardStats();
            renderPath();
            document.querySelectorAll('#page-lesson, #page-complete').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-dashboard').classList.remove('hidden');
        }

        function resetProgressPrompt() {
            showNotification("Voortgang wissen", "Weet je zeker dat je alle opgeslagen lessen en XP wilt resetten?");
            let modalBtn = document.querySelector('.custom-modal .btn');
            modalBtn.onclick = function() {
                localStorage.removeItem('wordly_ai_v4');
                location.reload();
            };
        }

        function showNotification(title, text) {
            document.getElementById('notif-title').innerText = title;
            document.getElementById('notif-text').innerText = text;
            document.getElementById('custom-notification').classList.remove('hidden');
        }

        function closeNotification() {
            document.getElementById('custom-notification').classList.add('hidden');
        }
    </script>
</body>
</html>
