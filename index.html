<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly</title>
    <style>
        :root {
            --primary: #ff7518;
            --primary-hover: #e06312;
            --bg: #fff8f5;
            --card-bg: #ffffff;
            --text: #2d2d2d;
            --border: #f0decc;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background: var(--card-bg);
            border-bottom: 2px solid var(--border);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .fox-mascot {
            width: 38px;
            height: 38px;
            background: var(--primary);
            border-radius: 50% 50% 40% 40%;
            position: relative;
            display: inline-block;
        }

        .fox-mascot::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 2px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 14px solid var(--primary);
            transform: rotate(-10deg);
        }

        .fox-mascot::after {
            content: '';
            position: absolute;
            top: -8px;
            right: 2px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 14px solid var(--primary);
            transform: rotate(10deg);
        }

        main {
            max-width: 650px;
            width: 100%;
            padding: 25px;
            box-sizing: border-box;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(255, 117, 24, 0.06);
        }

        h2 { 
            margin-top: 0; 
            font-size: 24px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 22px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.15s ease;
            border-bottom: 4px solid var(--primary-hover);
        }

        .btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .option-btn {
            background: white;
            color: var(--text);
            border: 2px solid var(--border);
            border-bottom: 4px solid #d4c0ab;
            margin: 10px 0;
            text-align: left;
        }

        .option-btn:hover {
            background: #fff3ed;
            border-color: var(--primary);
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 14px;
            font-size: 16px;
            box-sizing: border-box;
            margin-top: 10px;
            outline: none;
            background: #fafafa;
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--primary);
            background: white;
        }

        select {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 2px solid var(--border);
            margin: 10px 0 25px 0;
            font-size: 16px;
            background: white;
            outline: none;
        }

        .hidden { display: none !important; }
        
        .stats {
            font-weight: 700;
            color: #666;
            background: #fff3ed;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .feedback-correct {
            color: #2e7d32;
            font-weight: 700;
            font-size: 18px;
            margin: 15px 0;
        }

        .feedback-wrong {
            color: #c62828;
            font-weight: 700;
            font-size: 18px;
            margin: 15px 0;
        }

        .lesson-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .lesson-item {
            background: #fafafa;
            border: 2px solid var(--border);
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lesson-item:hover {
            background: #fff3ed;
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="fox-mascot"></div>
            Wordly
        </div>
        <div class="stats" id="stats-display">Lessons: 0</div>
    </header>

    <main>
        <div id="screen-auth" class="card">
            <h2 id="auth-title">Create Account</h2>
            <p id="auth-desc">Sign up with a private local account to start learning.</p>
            
            <label id="lbl-user">Username</label>
            <input type="text" id="auth-user" placeholder="Enter username...">
            
            <label id="lbl-pass" style="margin-top: 15px; display: block;">Password</label>
            <input type="password" id="auth-pass" placeholder="Enter password...">

            <button class="btn" id="auth-btn" onclick="handleAuth()">Create Account</button>
            <button class="btn" style="background: transparent; color: var(--primary); border: none; box-shadow: none; margin-top: 5px;" onclick="toggleAuthMode()" id="auth-switch">Already have an account? Log in</button>
        </div>

        <div id="screen-lang-ui" class="card hidden">
            <h2 id="ui-title">Select Default Language</h2>
            <p id="ui-desc">Choose the display language for the app.</p>
            <select id="ui-lang-select">
                <option value="en">English</option>
                <option value="nl">Nederlands</option>
            </select>
            <button class="btn" id="btn-save-ui" onclick="saveUILanguage()">Continue</button>
        </div>

        <div id="screen-goal" class="card hidden">
            <h2 id="goal-title">Why do you want to learn?</h2>
            <p id="goal-desc">Select your main goal.</p>
            
            <button class="btn option-btn" onclick="setGoal('Travel')">Travel</button>
            <button class="btn option-btn" onclick="setGoal('School')">School</button>
            <button class="btn option-btn" onclick="setGoal('Fun')">For Fun</button>
            <button class="btn option-btn" onclick="setGoal('Other')">I do not know</button>
        </div>

        <div id="screen-dashboard" class="card hidden">
            <h2 id="dash-title">Choose Course</h2>
            <select id="course-select" onchange="loadLessonsList()"></select>
            <div class="lesson-grid" id="lessons-list-container"></div>
            <button class="btn" style="background: #888; border-bottom-color: #555;" onclick="logout()">Log out</button>
        </div>

        <div id="screen-lesson" class="card hidden">
            <div id="question-container">
                <h3 id="question-title">Question</h3>
                <p id="question-text" style="font-size: 19px; font-weight: 600;"></p>
                <div id="answers-area"></div>
            </div>
            <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Next</button>
        </div>

        <div id="screen-complete" class="card hidden" style="text-align: center;">
            <h2 id="complete-title">Great job!</h2>
            <p id="complete-desc">You successfully completed this lesson.</p>
            <button class="btn" id="btn-back-dash" onclick="backToDashboard()">Back to Lessons</button>
        </div>
    </main>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(140, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        const translations = {
            en: {
                lessonsCount: "Lessons: ",
                createAccount: "Create Account",
                login: "Log In",
                authDesc: "Sign up with a private local account to start learning.",
                loginDesc: "Log in to your private account.",
                userLabel: "Username",
                passLabel: "Password",
                switchLogin: "Already have an account? Log in",
                switchCreate: "Don't have an account? Create one",
                selectUILang: "Select Default Language",
                selectUIDesc: "Choose the display language for the app.",
                continueBtn: "Continue",
                goalTitle: "Why do you want to learn?",
                goalDesc: "Select your main goal.",
                chooseCourse: "Choose Course",
                nextBtn: "Next",
                checkBtn: "Check",
                completeTitle: "Great job!",
                completeDesc: "You successfully completed this lesson.",
                backDash: "Back to Lessons",
                goals: { Travel: "Travel", School: "School", Fun: "For Fun", Other: "I do not know" }
            },
            nl: {
                lessonsCount: "Lessen: ",
                createAccount: "Account Aanmaken",
                login: "Inloggen",
                authDesc: "Maak een privé lokaal account aan om te beginnen.",
                loginDesc: "Log in op je privé account.",
                userLabel: "Gebruikersnaam",
                passLabel: "Wachtwoord",
                switchLogin: "Heb je al een account? Log in",
                switchCreate: "Geen account? Maak er een aan",
                selectUILang: "Kies Standaard Taal",
                selectUIDesc: "Kies de weergavetaal voor de app.",
                continueBtn: "Doorgaan",
                goalTitle: "Waarvoor wil je leren?",
                goalDesc: "Selecteer je hoofddoel.",
                chooseCourse: "Kies Cursus",
                nextBtn: "Volgende",
                checkBtn: "Controleer",
                completeTitle: "Geweldig gedaan!",
                completeDesc: "Je hebt deze les succesvol afgerond.",
                backDash: "Terug naar Lessen",
                goals: { Travel: "Reizen", School: "School", Fun: "Voor de leuk", Other: "Weet ik niet" }
            }
        };

        const wordBankEN_NL = [
            { en: "Dog", nl: "Hond" }, { en: "Cat", nl: "Kat" }, { en: "House", nl: "Huis" }, { en: "Water", nl: "Water" },
            { en: "Book", nl: "Boek" }, { en: "Apple", nl: "Appel" }, { en: "Car", nl: "Auto" }, { en: "Tree", nl: "Boom" },
            { en: "Milk", nl: "Melk" }, { en: "Bread", nl: "Brood" }, { en: "Sun", nl: "Zon" }, { en: "Moon", nl: "Maan" },
            { en: "Star", nl: "Ster" }, { en: "Fish", nl: "Vis" }, { en: "Bird", nl: "Vogel" }, { en: "Door", nl: "Deur" },
            { en: "Window", nl: "Raam" }, { en: "Table", nl: "Tafel" }, { en: "Chair", nl: "Stoel" }, { en: "Pen", nl: "Pen" },
            { en: "Paper", nl: "Papier" }, { en: "Road", nl: "Weg" }, { en: "City", nl: "Stad" }, { en: "Country", nl: "Land" },
            { en: "Friend", nl: "Vriend" }, { en: "Family", nl: "Familie" }, { en: "Time", nl: "Tijd" }, { en: "Day", nl: "Dag" },
            { en: "Night", nl: "Nacht" }, { en: "Food", nl: "Eten" }
        ];

        function generateLessons(direction) {
            const lessons = [];
            let currentQList = [];
            let lessonCounter = 1;

            for (let i = 0; i < wordBankEN_NL.length; i++) {
                let item = wordBankEN_NL[i];
                let promptText = direction === "nl-en" ? `Vertaal naar het Engels: '${item.nl}'` : `Translate to Dutch: '${item.en}'`;
                let correctAns = direction === "nl-en" ? item.en.toLowerCase() : item.nl.toLowerCase();
                let wrongOpts = wordBankEN_NL.filter(x => x !== item).sort(() => 0.5 - Math.random()).slice(0, 3);
                let options = wrongOpts.map(x => direction === "nl-en" ? x.en : x.nl);
                options.push(direction === "nl-en" ? item.en : item.nl);
                options.sort(() => 0.5 - Math.random());

                currentQList.push({
                    type: "multiple-choice",
                    prompt: promptText,
                    options: options,
                    correct: direction === "nl-en" ? item.en : item.nl
                });

                if (currentQList.length >= 5 || i === wordBankEN_NL.length - 1) {
                    lessons.push({
                        title: `Lesson ${lessonCounter}`,
                        questions: [...currentQList]
                    });
                    currentQList = [];
                    lessonCounter++;
                }
            }
            return lessons;
        }

        const courses = {
            "nl-en": {
                name: "Nederlands - Engels",
                lessons: generateLessons("nl-en")
            },
            "en-nl": {
                name: "Engels - Nederlands",
                lessons: generateLessons("en-nl")
            }
        };

        let isLoginMode = false;
        let currentUser = null;
        let currentUI = "en";
        let currentCourseKey = "en-nl";
        let currentLessonIndex = 0;
        let currentQuestionIndex = 0;

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            const t = translations[currentUI];
            document.getElementById('auth-title').innerText = isLoginMode ? t.login : t.createAccount;
            document.getElementById('auth-desc').innerText = isLoginMode ? t.loginDesc : t.authDesc;
            document.getElementById('auth-btn').innerText = isLoginMode ? t.login : t.createAccount;
            document.getElementById('auth-switch').innerText = isLoginMode ? t.switchCreate : t.switchLogin;
        }

        function handleAuth() {
            const user = document.getElementById('auth-user').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            if (!user || !pass) return alert("Please fill in both fields.");

            let accounts = JSON.parse(localStorage.getItem('wordly_secure_accounts') || "{}");

            if (isLoginMode) {
                if (!accounts[user] || accounts[user].pass !== pass) {
                    return alert("Invalid username or password.");
                }
                currentUser = accounts[user];
            } else {
                if (accounts[user]) {
                    return alert("Username already exists.");
                }
                currentUser = { user, pass, ui: "en", goal: "", completed: 0 };
                accounts[user] = currentUser;
                localStorage.setItem('wordly_secure_accounts', JSON.stringify(accounts));
            }

            document.getElementById('screen-auth').classList.add('hidden');
            if (!currentUser.uiSet) {
                document.getElementById('screen-lang-ui').classList.remove('hidden');
            } else if (!currentUser.goalSet) {
                document.getElementById('screen-goal').classList.remove('hidden');
            } else {
                openDashboard();
            }
        }

        function saveUILanguage() {
            currentUI = document.getElementById('ui-lang-select').value;
            currentUser.ui = currentUI;
            currentUser.uiSet = true;
            saveUser();
            updateUIText();

            document.getElementById('screen-lang-ui').classList.add('hidden');
            document.getElementById('screen-goal').classList.remove('hidden');
        }

        function setGoal(goal) {
            currentUser.goal = goal;
            currentUser.goalSet = true;
            saveUser();

            document.getElementById('screen-goal').classList.add('hidden');
            openDashboard();
        }

        function saveUser() {
            let accounts = JSON.parse(localStorage.getItem('wordly_secure_accounts') || "{}");
            accounts[currentUser.user] = currentUser;
            localStorage.setItem('wordly_secure_accounts', JSON.stringify(accounts));
        }

        function updateUIText() {
            const t = translations[currentUI];
            document.getElementById('stats-display').innerText = t.lessonsCount + (currentUser ? currentUser.completed : 0);
        }

        function openDashboard() {
            updateUIText();
            const select = document.getElementById('course-select');
            select.innerHTML = "";
            for (const key in courses) {
                let opt = document.createElement('option');
                opt.value = key;
                opt.innerText = courses[key].name;
                select.appendChild(opt);
            }
            loadLessonsList();
            document.getElementById('screen-dashboard').classList.remove('hidden');
        }

        function loadLessonsList() {
            const courseKey = document.getElementById('course-select').value;
            currentCourseKey = courseKey;
            const container = document.getElementById('lessons-list-container');
            container.innerHTML = "";

            courses[courseKey].lessons.forEach((lesson, index) => {
                let div = document.createElement('div');
                div.className = "lesson-item";
                div.innerHTML = `<span>${lesson.title}</span> <span>Start ➔</span>`;
                div.onclick = () => startLesson(index);
                container.appendChild(div);
            });
        }

        function startLesson(lessonIndex) {
            currentLessonIndex = lessonIndex;
            currentQuestionIndex = 0;
            document.getElementById('screen-dashboard').classList.add('hidden');
            document.getElementById('screen-lesson').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const lesson = courses[currentCourseKey].lessons[currentLessonIndex];

            if (currentQuestionIndex >= lesson.questions.length) {
                currentUser.completed++;
                saveUser();
                updateUIText();
                
                document.getElementById('screen-lesson').classList.add('hidden');
                document.getElementById('screen-complete').classList.remove('hidden');
                return;
            }

            const q = lesson.questions[currentQuestionIndex];
            document.getElementById('question-title').innerText = `${lesson.title} - Question ${currentQuestionIndex + 1} of ${lesson.questions.length}`;
            document.getElementById('question-text').innerText = q.prompt;
            
            const area = document.getElementById('answers-area');
            area.innerHTML = "";
            document.getElementById('next-btn').classList.add('hidden');

            q.options.forEach(option => {
                let btn = document.createElement('button');
                btn.className = "btn option-btn";
                btn.innerText = option;
                btn.onclick = () => checkAnswer(option, q.correct);
                area.appendChild(btn);
            });
        }

        function checkAnswer(given, correct) {
            const area = document.getElementById('answers-area');
            const t = translations[currentUI];
            
            if (given === correct) {
                playSound('correct');
                area.innerHTML = `<div class="feedback-correct">${currentUI === 'nl' ? 'Goed zo!' : 'Correct!'}</div>`;
            } else {
                playSound('wrong');
                area.innerHTML = `<div class="feedback-wrong">${currentUI === 'nl' ? 'Bijna! Het juiste antwoord is: ' : 'Almost! The correct answer is: '} ${correct}</div>`;
            }

            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function backToDashboard() {
            document.getElementById('screen-complete').classList.add('hidden');
            document.getElementById('screen-dashboard').classList.remove('hidden');
            loadLessonsList();
        }

        function logout() {
            currentUser = null;
            document.getElementById('screen-dashboard').classList.add('hidden');
            document.getElementById('screen-auth').classList.remove('hidden');
        }
    </script>
</body>
</html>
