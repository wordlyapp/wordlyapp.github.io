<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly AI – Premium Duolingo Style</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-hover: #46a302;
            --duo-green-shadow: #3b8201;
            --duo-light-green: #f4ffd7;
            --duo-dark: #2b2b2b;
            --duo-gray-text: #777777;
            --bg: #ffffff;
            --card-bg: #ffffff;
            --border: #e5e5e5;
            --accent-blue: #1cb0f6;
            --accent-blue-shadow: #1899d6;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            color: var(--duo-dark);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header.top-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            border-bottom: 2px solid var(--border);
            background: white;
            z-index: 100;
        }

        .logo-area {
            font-size: 20px;
            font-weight: 900;
            color: var(--duo-green);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-switcher {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f7f7f7;
            border: 2px solid var(--border);
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 12px;
        }

        .lang-switcher select {
            background: transparent;
            border: none;
            font-weight: 800;
            font-size: 12px;
            color: var(--duo-dark);
            outline: none;
            cursor: pointer;
        }

        .flag-icon {
            width: 20px;
            height: 14px;
            border-radius: 2px;
            object-fit: cover;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        .top-stats-bar {
            display: flex;
            gap: 8px;
        }

        .stat-pill {
            background: #f7f7f7;
            border: 2px solid var(--border);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 800;
            color: #4b4b4b;
        }

        .reset-btn {
            background: #fee2e2;
            color: #dc2626;
            border: 2px solid #fecaca;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .reset-btn:hover { background: #fecaca; }

        main.workspace {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 16px;
            background: #ffffff;
        }

        .content-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chapter-header {
            width: 100%;
            text-align: center;
            margin-bottom: 16px;
        }
        .chapter-header h2 { font-size: 20px; font-weight: 900; color: #3c3c3c; margin-bottom: 2px; }
        .chapter-header p { color: var(--duo-gray-text); font-size: 13px; font-weight: 700; }

        .chapter-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            width: 100%;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .chapter-tab {
            flex: 1;
            padding: 8px 10px;
            background: #f7f7f7;
            border: 2px solid var(--border);
            border-bottom: 3px solid var(--border);
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 12px;
            color: var(--duo-gray-text);
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
            white-space: nowrap;
        }

        .chapter-tab.active {
            background: var(--duo-light-green);
            border-color: var(--duo-green);
            border-bottom-color: var(--duo-green-shadow);
            color: var(--duo-green);
        }

        .chapter-tab.locked-tab {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f0f0f0;
        }

        .duo-path {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 5px 0 30px 0;
        }

        .path-row {
            display: flex;
            justify-content: center;
            width: 100%;
            gap: 60px;
        }

        .path-row.offset-1 { transform: translateX(-30px); }
        .path-row.offset-2 { transform: translateX(30px); }

        .duo-node {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--duo-green);
            border: none;
            border-bottom: 5px solid var(--duo-green-shadow);
            color: white;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
        }

        .duo-node span.node-label { font-size: 8px; opacity: 0.9; text-transform: uppercase; margin-top: 1px; }

        .duo-node:hover:not(.locked) { transform: scale(1.06); filter: brightness(1.05); }
        .duo-node:active:not(.locked) { transform: translateY(3px); border-bottom-width: 2px; box-shadow: 0 2px 0 rgba(0,0,0,0.08); }

        .duo-node.locked {
            background: #e5e5e5;
            border-bottom: 5px solid #d1d1d1;
            color: #afafaf;
            cursor: not-allowed;
            box-shadow: none;
        }

        .duo-node.current {
            animation: pulseNode 2s infinite;
        }

        @keyframes pulseNode {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(88, 204, 2, 0.5); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(88, 204, 2, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(88, 204, 2, 0); }
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            width: 100%;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lesson-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .back-btn {
            background: #f7f7f7;
            border: 2px solid var(--border);
            border-bottom: 3px solid var(--border);
            color: var(--duo-gray-text);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
        }
        .back-btn:hover { background: #eee; }

        .progress-bar-container {
            flex: 1;
            height: 10px;
            background: #e5e5e5;
            border-radius: 8px;
            margin: 0 16px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--duo-green);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 8px;
        }

        .question-title {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 14px;
            color: #3c3c3c;
            line-height: 1.3;
        }

        .btn {
            background-color: var(--duo-green);
            color: white;
            border: none;
            border-bottom: 4px solid var(--duo-green-shadow);
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 900;
            border-radius: var(--radius-sm);
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            transition: var(--transition);
            box-shadow: 0 3px 10px rgba(88, 204, 2, 0.25);
        }

        .btn:hover { filter: brightness(1.05); }
        .btn:active { transform: translateY(2px); border-bottom-width: 2px; box-shadow: none; }

        .option-btn {
            background: white;
            color: var(--duo-dark);
            border: 2px solid var(--border);
            border-bottom: 3px solid var(--border);
            margin: 6px 0;
            text-align: left;
            box-shadow: none;
            text-transform: none;
            font-weight: 800;
            font-size: 13px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
        }
        .option-btn:hover { background: #f7f7f7; border-color: #cfcfcf; }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
            padding: 12px;
            background: #f7f7f7;
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            min-height: 55px;
            align-content: flex-start;
        }

        .word-bubble {
            background: white;
            border: 2px solid var(--border);
            border-bottom: 3px solid var(--border);
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }
        .word-bubble:hover { background: #f0f0f0; border-color: #ccc; }
        .word-bubble:active { transform: translateY(2px); border-bottom-width: 1px; }

        .target-slot {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0;
            padding: 12px;
            background: #ffffff;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            min-height: 55px;
            align-content: center;
        }

        .feedback-box-correct {
            color: #278500; font-weight: 900; font-size: 13px; margin: 10px 0; padding: 10px;
            background: var(--duo-light-green); border-radius: var(--radius-sm); border: 2px solid #b8f270;
        }
        .feedback-box-wrong {
            color: #ea2b2b; font-weight: 900; font-size: 13px; margin: 10px 0; padding: 10px;
            background: #ffdfe0; border-radius: var(--radius-sm); border: 2px solid #ffb1b3;
        }

        .hidden { display: none !important; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .custom-modal {
            background: white;
            padding: 24px;
            border-radius: var(--radius-md);
            border: 2px solid var(--border);
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
        .custom-modal h3 { font-size: 18px; font-weight: 900; margin-bottom: 6px; color: #3c3c3c; }
        .custom-modal p { color: var(--duo-gray-text); font-size: 13px; font-weight: 700; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="custom-notification" class="modal-overlay hidden">
        <div class="custom-modal">
            <h3 id="notif-title">Melding</h3>
            <p id="notif-text">Tekst...</p>
            <button class="btn" onclick="closeNotification()" style="margin-top: 0;">Begrepen</button>
        </div>
    </div>

    <header class="top-nav">
        <div class="logo-area">
            🟢 Wordly AI
        </div>
        <div class="nav-controls">
            <div class="lang-switcher">
                <span>Van:</span>
                <img id="from-flag" class="flag-icon" src="" alt="">
                <select id="from-lang-select" onchange="changeLanguagePair()">
                    <option value="nl">Nederlands</option>
                    <option value="en">Engels</option>
                    <option value="ru">Russisch</option>
                    <option value="es">Spaans</option>
                    <option value="de">Duits</option>
                    <option value="fr">Frans</option>
                </select>
                <span>Naar:</span>
                <img id="to-flag" class="flag-icon" src="" alt="">
                <select id="to-lang-select" onchange="changeLanguagePair()">
                    <option value="en">Engels</option>
                    <option value="ru">Russisch</option>
                    <option value="es">Spaans</option>
                    <option value="de">Duits</option>
                    <option value="fr">Frans</option>
                    <option value="nl">Nederlands</option>
                </select>
            </div>

            <div class="top-stats-bar">
                <div class="stat-pill">🔥 <span id="streak-display">1</span></div>
                <div class="stat-pill">⚡ <span id="points-display">0</span> XP</div>
            </div>
            <button class="reset-btn" onclick="resetProgressPrompt()">Reset</button>
        </div>
    </header>

    <main class="workspace">
        <div class="content-container">
            <div id="page-dashboard" style="width: 100%;">
                <div class="chapter-header">
                    <h2 id="chapter-title-display">Hoofdstuk 1: Basis & Introductie</h2>
                    <p id="chapter-desc-display">Leer fundamentele woorden en simpele zinnen.</p>
                </div>

                <div class="chapter-tabs" id="chapter-tabs-container"></div>

                <div class="duo-path" id="path-container"></div>
            </div>

            <div id="page-lesson" class="card page-section hidden">
                <div class="lesson-top-bar">
                    <button class="back-btn" onclick="backToDashboard()">✕ Stoppen</button>
                    <div class="progress-bar-container">
                        <div id="lesson-progress-bar" class="progress-bar-fill"></div>
                    </div>
                    <span id="lesson-progress-text" style="font-weight: 800; color: var(--duo-gray-text); font-size: 12px;">1/8</span>
                </div>
                <h3 id="question-prompt" class="question-title">Vertaal dit</h3>
                
                <div id="answers-area"></div>
                
                <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Doorgaan</button>
            </div>

            <div id="page-complete" class="card page-section hidden" style="text-align: center;">
                <h2 style="font-size: 22px; font-weight: 900; color: var(--duo-green); margin-bottom: 8px;">Les Voltooid! 🎉</h2>
                <p id="complete-text" style="color: var(--duo-gray-text); font-size: 13px; font-weight: 700; margin-bottom: 20px;">Geweldig gepresteerd!</p>
                <button class="btn" onclick="backToDashboard()">Doorgaan</button>
            </div>

        </div>
    </main>

        const chapterNames = [
            "Hoofdstuk 1: Basis & Introductie",
            "Hoofdstuk 2: Eten & Drinken",
            "Hoofdstuk 3: Reizen & Vervoer",
            "Hoofdstuk 4: Familie & Mensen",
            "Hoofdstuk 5: Huis & Omgeving",
            "Hoofdstuk 6: Kleuren & Cijfers",
            "Hoofdstuk 7: Dieren in de Natuur",
            "Hoofdstuk 8: Hobby's & Sport",
            "Hoofdstuk 9: School & Werk",
            "Hoofdstuk 10: Tijd & Weer"
        ];

        const chapterDescriptions = [
            "Leer fundamentele woorden en simpele begroetingen.",
            "Alles over lekker eten, drinken en boodschappen doen.",
            "Vervoermiddelen, stations en reizen naar het buitenland.",
            "Familieleden, vrienden en relaties beschrijven.",
            "Kamers, meubels en je eigen woning.",
            "De mooiste kleuren en getallen tellen.",
            "Dieren in het wild en huisdieren.",
            "Sporten, games spelen en ontspanning.",
            "Nuttige woorden voor op school en tijdens je werk.",
            "Het weer vandaag en besef van tijd."
        ];

        let appData = JSON.parse(localStorage.getItem('wordly_ai_v6')) || {
            points: 0,
            streak: 1,
            fromLang: "nl",
            toLang: "en",
            activeChapter: 0,
            completed: {}
        };

        function saveData() {
            localStorage.setItem('wordly_ai_v6', JSON.stringify(appData));
        }

        window.onload = function() {
            document.getElementById('from-lang-select').value = appData.fromLang;
            document.getElementById('to-lang-select').value = appData.toLang;
            updateFlags();
            renderChapterTabs();
            updateDashboardStats();
            renderPath();
        };

        function updateFlags() {
            document.getElementById('from-flag').src = flags[appData.fromLang] || flags.nl;
            document.getElementById('to-flag').src = flags[appData.toLang] || flags.en;
        }

        function changeLanguagePair() {
            let newFrom = document.getElementById('from-lang-select').value;
            let newTo = document.getElementById('to-lang-select').value;
            
            if(newFrom === newTo) {
                showNotification("Let op", "De brontaal en doeltaal mogen niet hetzelfde zijn!");
                document.getElementById('from-lang-select').value = appData.fromLang;
                document.getElementById('to-lang-select').value = appData.toLang;
                return;
            }

            appData.fromLang = newFrom;
            appData.toLang = newTo;
            appData.activeChapter = 0;
            updateFlags();
            saveData();
            renderChapterTabs();
            updateDashboardStats();
            renderPath();
        }

        function updateDashboardStats() {
            document.getElementById('points-display').innerText = appData.points;
            document.getElementById('streak-display').innerText = appData.streak;
            document.getElementById('chapter-title-display').innerText = chapterNames[appData.activeChapter];
            document.getElementById('chapter-desc-display').innerText = chapterDescriptions[appData.activeChapter];
        }

        function getActivePairKey() {
            return `${appData.fromLang}-${appData.toLang}`;
        }

        function isChapterUnlocked(chapterIndex) {
            if(chapterIndex === 0) return true;
            let pairKey = getActivePairKey();
            let prevChapterKey = `${pairKey}_ch${chapterIndex - 1}`;
            let completedLessons = appData.completed[prevChapterKey] || [];
            return completedLessons.length >= 6;
        }

        function renderChapterTabs() {
            let container = document.getElementById('chapter-tabs-container');
            container.innerHTML = "";
            for(let i = 0; i < 10; i++) {
                let unlocked = isChapterUnlocked(i);
                let tab = document.createElement('button');
                tab.className = `chapter-tab ${appData.activeChapter === i ? 'active' : ''} ${!unlocked ? 'locked-tab' : ''}`;
                tab.innerText = `H${i+1}`;
                
                tab.onclick = () => {
                    if(!unlocked) {
                        showNotification("Hoofdstuk Vergrendeld", "Je moet eerst alle lessen van het vorige hoofdstuk volledig afronden om dit hoofdstuk te ontgrendelen!");
                        return;
                    }
                    appData.activeChapter = i;
                    saveData();
                    updateDashboardStats();
                    renderPath();
                };
                container.appendChild(tab);
            }
        }

        function getActiveQuestionsList() {
            let from = appData.fromLang;
            let to = appData.toLang;
            if(masterDictionary[from] && masterDictionary[from][to]) {
                let rawList = masterDictionary[from][to];
                // Genereer dynamisch voldoende vragen per hoofdstuk op basis van de woordenboeklijst
                let chapterList = [];
                let startIndex = (appData.activeChapter * 3) % rawList.length;
                for(let i = 0; i < 5; i++) {
                    let item = rawList[(startIndex + i) % rawList.length];
                    chapterList.push({ q: item[0], a: item[1], opts: item[2] });
                }
                return chapterList;
            }
            // Fallback als een combinatie niet direct bestaat
            return [
                { q: "Word", a: "Woord", opts: ["Woord", "Zin", "Taal", "Boek"] },
                { q: "Learn", a: "Leren", opts: ["Leren", "Schrijven", "Lezen", "Horen"] },
                { q: "Language", a: "Taal", opts: ["Taal", "Land", "Huis", "Stad"] },
                { q: "Friend", a: "Vriend", opts: ["Vriend", "Vijand", "Broer", "Vader"] },
                { q: "Good", a: "Goed", opts: ["Goed", "Slecht", "Mooi", "Groot"] }
            ];
        }

        function renderPath() {
            renderChapterTabs();
            let container = document.getElementById('path-container');
            container.innerHTML = "";
            
            let totalLessonsInChapter = 6;
            let pairKey = getActivePairKey();
            let currentKey = `${pairKey}_ch${appData.activeChapter}`;
            let langCompleted = appData.completed[currentKey] || [];

            for(let i = 0; i < totalLessonsInChapter; i++) {
                let row = document.createElement('div');
                row.className = `path-row offset-${i % 3}`;

                let isDone = langCompleted.includes(i);
                let isUnlocked = i === 0 || langCompleted.includes(i - 1);

                let node = document.createElement('button');
                node.className = `duo-node ${isDone ? 'done' : (!isUnlocked ? 'locked' : 'current')}`;
                if(isDone) node.style.background = "var(--duo-green)";
                node.innerHTML = `${i + 1}<span class="node-label">Les</span>`;
                
                if(isUnlocked) {
                    node.onclick = () => startLesson(i);
                } else {
                    node.onclick = () => {
                        showNotification("Les Vergrendeld", "Voltooi eerst de vorige les in dit hoofdstuk!");
                    };
                }

                row.appendChild(node);
                container.appendChild(row);
            }
        }

        let activeQuestions = [], currentQIdx = 0, activeLessonIdx = 0, currentLessonErrors = 0;

        function startLesson(lessonIdx) {
            activeLessonIdx = lessonIdx;
            let pool = getActiveQuestionsList();
            activeQuestions = [];
            for(let q = 0; q < 5; q++) {
                let base = pool[(lessonIdx + q) % pool.length];
                activeQuestions.push(base);
            }
            currentQIdx = 0;
            currentLessonErrors = 0;
            
            document.querySelectorAll('#page-dashboard, #page-lesson, #page-complete').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-lesson').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            if(currentQIdx >= activeQuestions.length) {
                appData.points += 20;
                let pairKey = getActivePairKey();
                let key = `${pairKey}_ch${appData.activeChapter}`;
                if(!appData.completed[key]) appData.completed[key] = [];
                if(!appData.completed[key].includes(activeLessonIdx)) {
                    appData.completed[key].push(activeLessonIdx);
                }
                saveData();
                updateDashboardStats();

                document.querySelectorAll('#page-dashboard, #page-lesson, #page-complete').forEach(p => p.classList.add('hidden'));
                document.getElementById('page-complete').classList.remove('hidden');
                document.getElementById('complete-text').innerText = `Les ${activeLessonIdx + 1} succesvol afgerond in ${chapterNames[appData.activeChapter]}!`;
                return;
            }

            let qObj = activeQuestions[currentQIdx];
            let progressPercent = (currentQIdx / activeQuestions.length) * 100;
            document.getElementById('lesson-progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('lesson-progress-text').innerText = `${currentQIdx + 1}/${activeQuestions.length}`;
            document.getElementById('question-prompt').innerText = `Vertaal / Beantwoord: "${qObj.q}"`;

            let area = document.getElementById('answers-area');
            area.innerHTML = "";
            document.getElementById('next-btn').classList.add('hidden');

            let shuffledOpts = [...qObj.opts].sort(() => 0.5 - Math.random());
            shuffledOpts.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = "btn option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkMcAnswer(opt, qObj.a);
                area.appendChild(btn);
            });
        }

        function checkMcAnswer(given, correct) {
            let area = document.getElementById('answers-area');
            area.querySelectorAll('button').forEach(b => b.disabled = true);

            if(given.toLowerCase() === correct.toLowerCase()) {
                area.innerHTML += `<div class="feedback-box-correct">Geweldig! Dat is correct.</div>`;
            } else {
                currentLessonErrors++;
                area.innerHTML += `<div class="feedback-box-wrong">Helaas! Het juiste antwoord was: <strong>${correct}</strong></div>`;
            }
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQIdx++;
            loadQuestion();
        }

        function backToDashboard() {
            updateDashboardStats();
            renderPath();
            document.querySelectorAll('#page-lesson, #page-complete').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-dashboard').classList.remove('hidden');
        }

        function resetProgressPrompt() {
            showNotification("Voortgang wissen", "Weet je zeker dat je alle opgeslagen lessen en XP wilt resetten?");
            let modalBtn = document.querySelector('.custom-modal .btn');
            modalBtn.onclick = function() {
                localStorage.removeItem('wordly_ai_v6');
                location.reload();
            };
        }

        function showNotification(title, text) {
            document.getElementById('notif-title').innerText = title;
            document.getElementById('notif-text').innerText = text;
            document.getElementById('custom-notification').classList.remove('hidden');
        }

        function closeNotification() {
            document.getElementById('custom-notification').classList.add('hidden');
        }
    </script>
