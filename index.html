<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly Learn </title>

    <link rel="icon" type="image/jpeg" href="https://wordlyapp.github.io/Gemini_Generated_Image_v65lbkv65lbkv65l.jpg">
    <link rel="apple-touch-icon" href="https://wordlyapp.github.io/Gemini_Generated_Image_v65lbkv65lbkv65l.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-hover: #46a302;
            --duo-green-shadow: #3b8201;
            --duo-light-green: #f4ffd7;
            --duo-dark: #2b2b2b;
            --duo-gray-text: #777777;
            --bg: #ffffff;
            --card-bg: #ffffff;
            --border: #e5e5e5;
            --accent-blue: #1cb0f6;
            --accent-blue-shadow: #1899d6;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            color: var(--duo-dark);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header.top-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            border-bottom: 2px solid var(--border);
            background: white;
            z-index: 100;
        }

        .logo-area {
            font-size: 20px;
            font-weight: 900;
            color: var(--duo-green);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Styling voor het logo in de header */
        .logo-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--duo-green);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .custom-dropdown-container {
            position: relative;
            display: inline-block;
        }

        .lang-dropdown-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f7f7f7;
            border: 2px solid var(--border);
            border-bottom: 3px solid var(--border);
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 12px;
            color: var(--duo-dark);
            cursor: pointer;
            transition: var(--transition);
        }
        .lang-dropdown-btn:hover { background: #eee; }

        .flag-icon {
            width: 20px;
            height: 14px;
            border-radius: 2px;
            object-fit: cover;
            box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }

        .lang-menu-content {
            display: none;
            position: absolute;
            right: 0;
            top: 110%;
            background-color: white;
            min-width: 150px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            z-index: 1000;
            overflow: hidden;
        }

        .lang-menu-content.show {
            display: block;
        }

        .lang-option {
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 800;
            color: var(--duo-dark);
            cursor: pointer;
            transition: var(--transition);
        }
        .lang-option:hover {
            background-color: var(--duo-light-green);
            color: var(--duo-green);
        }

        .lang-switcher-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f7f7f7;
            border: 2px solid var(--border);
            padding: 3px 8px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 12px;
        }

        .top-stats-bar {
            display: flex;
            gap: 8px;
        }

        .stat-pill {
            background: #f7f7f7;
            border: 2px solid var(--border);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 800;
            color: #4b4b4b;
        }

        .reset-btn {
            background: #fee2e2;
            color: #dc2626;
            border: 2px solid #fecaca;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .reset-btn:hover { background: #fecaca; }

        main.workspace {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 16px;
            background: #ffffff;
        }

        .content-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chapter-header {
            width: 100%;
            text-align: center;
            margin-bottom: 16px;
        }
        .chapter-header h2 { font-size: 20px; font-weight: 900; color: #3c3c3c; margin-bottom: 2px; }
        .chapter-header p { color: var(--duo-gray-text); font-size: 13px; font-weight: 700; }

        .chapter-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            width: 100%;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .chapter-tab {
            flex: 1;
            padding: 8px 10px;
            background: #f7f7f7;
            border: 2px solid var(--border);
            border-bottom: 3px solid var(--border);
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 12px;
            color: var(--duo-gray-text);
            cursor: pointer;
            text-align: center;
            transition: var(--transition);
            white-space: nowrap;
        }

        .chapter-tab.active {
            background: var(--duo-light-green);
            border-color: var(--duo-green);
            border-bottom-color: var(--duo-green-shadow);
            color: var(--duo-green);
        }

        .chapter-tab.locked-tab {
            opacity: 0.5;
            cursor: not-allowed;
            background: #f0f0f0;
        }

        .duo-path {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 5px 0 30px 0;
        }

        .path-row {
            display: flex;
            justify-content: center;
            width: 100%;
            gap: 60px;
        }

        .path-row.offset-1 { transform: translateX(-30px); }
        .path-row.offset-2 { transform: translateX(30px); }

        .duo-node {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--duo-green);
            border: none;
            border-bottom: 5px solid var(--duo-green-shadow);
            color: white;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
        }

        .duo-node span.node-label { font-size: 8px; opacity: 0.9; text-transform: uppercase; margin-top: 1px; }

        .duo-node:hover:not(.locked) { transform: scale(1.06); filter: brightness(1.05); }
        .duo-node:active:not(.locked) { transform: translateY(3px); border-bottom-width: 2px; box-shadow: 0 2px 0 rgba(0,0,0,0.08); }

        .duo-node.locked {
            background: #e5e5e5;
            border-bottom: 5px solid #d1d1d1;
            color: #afafaf;
            cursor: not-allowed;
            box-shadow: none;
        }

        .duo-node.exam-node {
            background: #ff9600;
            border-bottom: 5px solid #cc7700;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            width: 100%;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lesson-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .back-btn {
            background: #f7f7f7;
            border: 2px solid var(--border);
            border-bottom: 3px solid var(--border);
            color: var(--duo-gray-text);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
        }
        .back-btn:hover { background: #eee; }

        .progress-bar-container {
            flex: 1;
            height: 10px;
            background: #e5e5e5;
            border-radius: 8px;
            margin: 0 16px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--duo-green);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 8px;
        }

        .question-title {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 14px;
            color: #3c3c3c;
            line-height: 1.3;
        }

        .btn {
            background-color: var(--duo-green);
            color: white;
            border: none;
            border-bottom: 4px solid var(--duo-green-shadow);
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 900;
            border-radius: var(--radius-sm);
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            transition: var(--transition);
            box-shadow: 0 3px 10px rgba(88, 204, 2, 0.25);
        }

        .btn:hover { filter: brightness(1.05); }
        .btn:active { transform: translateY(2px); border-bottom-width: 2px; box-shadow: none; }

        .option-btn {
            background: white;
            color: var(--duo-dark);
            border: 2px solid var(--border);
            border-bottom: 3px solid var(--border);
            margin: 6px 0;
            text-align: left;
            box-shadow: none;
            text-transform: none;
            font-weight: 800;
            font-size: 13px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
        }
        .option-btn:hover { background: #f7f7f7; border-color: #cfcfcf; }

        .feedback-box-correct {
            color: #278500; font-weight: 900; font-size: 13px; margin: 10px 0; padding: 10px;
            background: var(--duo-light-green); border-radius: var(--radius-sm); border: 2px solid #b8f270;
        }
        .feedback-box-wrong {
            color: #ea2b2b; font-weight: 900; font-size: 13px; margin: 10px 0; padding: 10px;
            background: #ffdfe0; border-radius: var(--radius-sm); border: 2px solid #ffb1b3;
        }

        .hidden { display: none !important; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .custom-modal {
            background: white;
            padding: 24px;
            border-radius: var(--radius-md);
            border: 2px solid var(--border);
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
        }
        .custom-modal h3 { font-size: 18px; font-weight: 900; margin-bottom: 6px; color: #3c3c3c; }
        .custom-modal p { color: var(--duo-gray-text); font-size: 13px; font-weight: 700; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="custom-notification" class="modal-overlay hidden">
        <div class="custom-modal">
            <h3 id="notif-title">Melding</h3>
            <p id="notif-text">Tekst...</p>
            <button class="btn" id="notif-ok-btn" onclick="closeNotification()">Begrepen</button>
        </div>
    </div>

    <header class="top-nav">
        <div class="logo-area">
            <img src="https://wordlyapp.github.io/Gemini_Generated_Image_v65lbkv65lbkv65l.jpg" alt="Wordly Logo" class="logo-img"> Wordly Learn
        </div>
        <div class="nav-controls">
            <div class="lang-switcher-wrapper">
                <span id="label-from-text">Van:</span>
                <div class="custom-dropdown-container">
                    <button class="lang-dropdown-btn" onclick="toggleMenu('from-menu')">
                        <img id="from-flag" class="flag-icon" src="" alt="">
                        <span id="from-label">Nederlands</span> ▾
                    </button>
                    <div id="from-menu" class="lang-menu-content">
                        <div class="lang-option" onclick="selectLanguage('from', 'nl', 'Nederlands')"><img class="flag-icon" src="https://flagcdn.com/w40/nl.png"> Nederlands</div>
                        <div class="lang-option" onclick="selectLanguage('from', 'en', 'Engels')"><img class="flag-icon" src="https://flagcdn.com/w40/gb.png"> Engels</div>
                        <div class="lang-option" onclick="selectLanguage('from', 'de', 'Duits')"><img class="flag-icon" src="https://flagcdn.com/w40/de.png"> Duits</div>
                        <div class="lang-option" onclick="selectLanguage('from', 'fr', 'Frans')"><img class="flag-icon" src="https://flagcdn.com/w40/fr.png"> Frans</div>
                        <div class="lang-option" onclick="selectLanguage('from', 'es', 'Spaans')"><img class="flag-icon" src="https://flagcdn.com/w40/es.png"> Spaans</div>
                    </div>
                </div>

                <span style="margin-left: 4px;" id="label-to-text">Naar:</span>
                <div class="custom-dropdown-container">
                    <button class="lang-dropdown-btn" onclick="toggleMenu('to-menu')">
                        <img id="to-flag" class="flag-icon" src="" alt="">
                        <span id="to-label">Engels</span> ▾
                    </button>
                    <div id="to-menu" class="lang-menu-content">
                        <div class="lang-option" onclick="selectLanguage('to', 'nl', 'Nederlands')"><img class="flag-icon" src="https://flagcdn.com/w40/nl.png"> Nederlands</div>
                        <div class="lang-option" onclick="selectLanguage('to', 'en', 'Engels')"><img class="flag-icon" src="https://flagcdn.com/w40/gb.png"> Engels</div>
                        <div class="lang-option" onclick="selectLanguage('to', 'de', 'Duits')"><img class="flag-icon" src="https://flagcdn.com/w40/de.png"> Duits</div>
                        <div class="lang-option" onclick="selectLanguage('to', 'fr', 'Frans')"><img class="flag-icon" src="https://flagcdn.com/w40/fr.png"> Frans</div>
                        <div class="lang-option" onclick="selectLanguage('to', 'es', 'Spaans')"><img class="flag-icon" src="https://flagcdn.com/w40/es.png"> Spaans</div>
                    </div>
                </div>
            </div>

            <div class="top-stats-bar">
                <div class="stat-pill">🔥 <span id="streak-display">1</span></div>
                <div class="stat-pill">⚡ <span id="points-display">0</span> XP</div>
            </div>
            <button class="reset-btn" id="reset-btn-text" onclick="resetProgressPrompt()">Reset</button>
        </div>
    </header>

    <main class="workspace">
        <div class="content-container">
            <div id="page-dashboard" style="width: 100%;">
                <div class="chapter-header">
                    <h2 id="chapter-title-display">Hoofdstuk 1: Basis & Introductie</h2>
                    <p id="chapter-desc-display">Leer fundamentele woorden en simpele zinnen.</p>
                </div>

                <div class="chapter-tabs" id="chapter-tabs-container"></div>

                <div class="duo-path" id="path-container"></div>
            </div>

            <div id="page-lesson" class="card page-section hidden">
                <div class="lesson-top-bar">
                    <button class="back-btn" id="stop-btn-text" onclick="backToDashboard()">✕ Stoppen</button>
                    <div class="progress-bar-container">
                        <div id="lesson-progress-bar" class="progress-bar-fill"></div>
                    </div>
                    <span id="lesson-progress-text" style="font-weight: 800; color: var(--duo-gray-text); font-size: 12px;">1/5</span>
                </div>
                <h3 id="question-prompt" class="question-title">Vertaal dit</h3>
                
                <div id="answers-area"></div>
                
                <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Doorgaan</button>
            </div>

            <div id="page-complete" class="card page-section hidden" style="text-align: center;">
                <h2 id="complete-title-text" style="font-size: 22px; font-weight: 900; color: var(--duo-green); margin-bottom: 8px;">Les Voltooid! 🎉</h2>
                <p id="complete-text" style="color: var(--duo-gray-text); font-size: 13px; font-weight: 700; margin-bottom: 20px;">Geweldig gepresteerd!</p>
                <button class="btn" id="complete-continue-btn" onclick="backToDashboard()">Doorgaan</button>
            </div>

        </div>
    </main>

                resetTitle: "Borrar progreso",

        };

        function t(key) {

            if (uiTranslations[lang] && uiTranslations[lang][key]) {
                return uiTranslations[lang][key];
            }
            return uiTranslations["nl"][key];

        const masterDatabase = {

            "de": [
                [["Hallo", "Hallo"], ["Goedemorgen", "Guten Morgen"], ["Goedemiddag", "Guten Tag"], ["Goedenavond", "Guten Abend"], ["Welterusten", "Gute Nacht"], ["Dank je wel", "Danke"], ["Tot ziens", "Tschüss"], ["Alsjeblieft", "Bitte"], ["Ja", "Ja"], ["Nee", "Nein"]],
                [["Appel", "Apfel"], ["Banaan", "Banane"], ["Water", "Wasser"], ["Brood", "Brot"], ["Melk", "Milch"], ["Kaas", "Käse"], ["Koffie", "Kaffee"], ["Thee", "Tee"], ["Vlees", "Fleisch"], ["Vis", "Fisch"]],

            "fr": [

                [["Appel", "Pomme"], ["Banaan", "Banane"], ["Water", "Eau"], ["Brood", "Pain"], ["Melk", "Lait"], ["Kaas", "Fromage"], ["Koffie", "Café"], ["Thee", "Thé"], ["Vlees", "Viande"], ["Vis", "Poisson"]],

                Array(10).fill(["Tijd", "Temps"])
            ],
            "es": [
                [["Hallo", "Hola"], ["Goedemorgen", "Buenos días"], ["Goedemiddag", "Buenas tardes"], ["Goedenavond", "Buenas noches"], ["Welterusten", "Buenas noches"], ["Dank je wel", "Gracias"], ["Tot ziens", "Adiós"], ["Alsjeblieft", "Por favor"], ["Ja", "Sí"], ["Nee", "No"]],
                [["Appel", "Manzana"], ["Banaan", "Plátano"], ["Water", "Agua"], ["Brood", "Pan"], ["Melk", "Leche"], ["Kaas", "Queso"], ["Koffie", "Café"], ["Thee", "Té"], ["Vlees", "Carne"], ["Vis", "Pescado"]],
                Array(10).fill(["Trein", "Tren"]),
                Array(10).fill(["Vader", "Padre"]),
                Array(10).fill(["Casa", "Casa"]),
                Array(10).fill(["Rood", "Rojo"]),
                Array(10).fill(["Hond", "Perro"]),
                Array(10).fill(["Spel", "Juego"]),
                Array(10).fill(["School", "Escuela"]),
                Array(10).fill(["Tijd", "Tiempo"])
            ]
        };

        const chapterNames = [
            "Hoofdstuk 1: Basis & Introductie",
            "Hoofdstuk 2: Eten & Drinken",
            "Hoofdstuk 3: Reizen & Vervoer",
            "Hoofdstuk 4: Familie & Mensen",
            "Hoofdstuk 5: Huis & Omgeving",
            "Hoofdstuk 6: Kleuren & Cijfers",
            "Hoofdstuk 7: Dieren in de Natuur",
            "Hoofdstuk 8: Hobby's & Sport",
            "Hoofdstuk 9: School & Werk",
            "Hoofdstuk 10: Tijd & Weer"
        ];

        const chapterDescriptions = [
            "Leer fundamentele woorden en simpele begroetingen.",
            "Alles over lekker eten, drinken en boodschappen doen.",
            "Vervoermiddelen, stations en reizen naar het buiteland.",
            "Familieleden, vrienden en relaties beschrijven.",
            "Kamers, meubels en je eigen woning.",
            "De mooiste kleuren en getallen tellen.",
            "Dieren in het wild en huisdieren.",
            "Sporten, games spelen en ontspanning.",
            "Nuttige woorden voor op school en tijdens je werk.",
            "Het weer vandaag en besef van tijd."
        ];

        let appData = JSON.parse(localStorage.getItem('wordly_learn_v9')) || {
            points: 0,
            streak: 1,
            fromLang: "nl",
            toLang: "en",
            activeChapter: 0,
            languageProgress: {}
        };

        function saveData() {
            localStorage.setItem('wordly_learn_v9', JSON.stringify(appData));
        }

        window.onload = function() {
            updateUIStrings();
            renderChapterTabs();
            updateDashboardStats();
            renderPath();

            window.onclick = function(event) {
                if (!event.target.closest('.custom-dropdown-container')) {
                    document.querySelectorAll('.lang-menu-content').forEach(menu => menu.classList.remove('show'));
                }
            };
        };

        function toggleMenu(menuId) {
            document.querySelectorAll('.lang-menu-content').forEach(m => {
                if(m.id !== menuId) m.classList.remove('show');
            });
            document.getElementById(menuId).classList.toggle('show');
        }

        function selectLanguage(type, code, name) {
            if (type === 'from') {
                if (code === appData.toLang) {
                    showNotification(t("sameLangTitle"), t("sameLangText"));
                    return;
                }
                appData.fromLang = code;
            } else {
                if (code === appData.fromLang) {
                    showNotification(t("sameLangTitle"), t("sameLangText"));
                    return;
                }
                appData.toLang = code;
            }

            appData.activeChapter = 0;
            saveData();
            updateUIStrings();
            renderChapterTabs();
            updateDashboardStats();
            renderPath();
            document.querySelectorAll('.lang-menu-content').forEach(m => m.classList.remove('show'));
        }

        function updateUIStrings() {
            document.getElementById('from-flag').src = flags[appData.fromLang] || flags.nl;
            document.getElementById('from-label').innerText = langNames[appData.fromLang];
            document.getElementById('to-flag').src = flags[appData.toLang] || flags.en;
            document.getElementById('to-label').innerText = langNames[appData.toLang];

            document.getElementById('label-from-text').innerText = t("labelFrom");
            document.getElementById('label-to-text').innerText = t("labelTo");
            document.getElementById('reset-btn-text').innerText = t("reset");
            document.getElementById('stop-btn-text').innerText = t("stop");
            document.getElementById('notif-ok-btn').innerText = t("notifOk");
            document.getElementById('complete-continue-btn').innerText = t("continueBtn");
            document.getElementById('complete-title-text').innerText = t("completeTitle");
            document.getElementById('complete-text').innerText = t("completeSub");
        }

        function updateDashboardStats() {
            document.getElementById('points-display').innerText = appData.points;
            document.getElementById('streak-display').innerText = appData.streak;
            document.getElementById('chapter-title-display').innerText = chapterNames[appData.activeChapter];
            document.getElementById('chapter-desc-display').innerText = chapterDescriptions[appData.activeChapter];
        }

        function getActivePairKey() {
            return `${appData.fromLang}-${appData.toLang}`;
        }

        function getCurrentLangCompletedMap() {
            let pairKey = getActivePairKey();
            if(!appData.languageProgress[pairKey]) {
                appData.languageProgress[pairKey] = {};
            }
            return appData.languageProgress[pairKey];
        }

        function isChapterUnlocked(chapterIndex) {
            if(chapterIndex === 0) return true;
            let langProgress = getCurrentLangCompletedMap();
            let prevChapterKey = `ch${chapterIndex - 1}`;
            let completedLessons = langProgress[prevChapterKey] || [];
            return completedLessons.length >= 6;
        }

        function renderChapterTabs() {
            let container = document.getElementById('chapter-tabs-container');
            container.innerHTML = "";
            for(let i = 0; i < 10; i++) {
                let unlocked = isChapterUnlocked(i);
                let tab = document.createElement('button');
                tab.className = `chapter-tab ${appData.activeChapter === i ? 'active' : ''} ${!unlocked ? 'locked-tab' : ''}`;
                tab.innerText = `H${i+1}`;
                
                tab.onclick = () => {
                    if(!unlocked) {
                        showNotification(t("lockTitle"), t("lockText"));
                        return;
                    }
                    appData.activeChapter = i;
                    saveData();
                    updateDashboardStats();
                    renderPath();
                };
                container.appendChild(tab);
            }
        }

        function renderPath() {
            renderChapterTabs();
            let container = document.getElementById('path-container');
            container.innerHTML = "";
            
            let totalNodes = 6;
            let langProgress = getCurrentLangCompletedMap();
            let currentKey = `ch${appData.activeChapter}`;
            let langCompleted = langProgress[currentKey] || [];

            for(let i = 0; i < totalNodes; i++) {
                let row = document.createElement('div');
                row.className = `path-row offset-${i % 3}`;

                let isDone = langCompleted.includes(i);
                let isUnlocked = i === 0 || langCompleted.includes(i - 1);
                let isExam = (i === totalNodes - 1);

                let node = document.createElement('button');
                node.className = `duo-node ${isExam ? 'exam-node' : ''} ${isDone ? 'done' : (!isUnlocked ? 'locked' : 'current')}`;
                if(isDone) node.style.background = isExam ? "#ff9600" : "var(--duo-green)";
                
                if(isExam) {
                    node.innerHTML = `🏆<span class="node-label">${t("examLabel")}</span>`;
                } else {
                    node.innerHTML = `${i + 1}<span class="node-label">${t("lessonLabel")}</span>`;
                }
                
                if(isUnlocked) {
                    node.onclick = () => startLesson(i, isExam);
                } else {
                    node.onclick = () => {
                        showNotification(t("nodeLockTitle"), t("nodeLockText"));
                    };
                }

                row.appendChild(node);
                container.appendChild(row);
            }
        }

        function getChapterWordList() {
            let from = appData.fromLang;
            let to = appData.toLang;
            let chapterIdx = appData.activeChapter;

            if (from === "nl" && masterDatabase[to]) {
                let pairs = masterDatabase[to][chapterIdx] || masterDatabase[to][0];
                return pairs.map(item => {
                    let termA = item[0];
                    let termB = item[1];
                    let allOpts = (masterDatabase[to][chapterIdx] || masterDatabase[to][0]).map(i => i[1]);
                    return [termA, termB, allOpts];
                });
            } else if (to === "nl" && masterDatabase[from]) {
                let pairs = masterDatabase[from][chapterIdx] || masterDatabase[from][0];
                return pairs.map(item => {
                    let termA = item[1];
                    let termB = item[0];
                    let allOpts = (masterDatabase[from][chapterIdx] || masterDatabase[from][0]).map(i => i[0]);
                    return [termA, termB, allOpts];
                });
            } else {
                let fromPairs = masterDatabase[from] ? (masterDatabase[from][chapterIdx] || masterDatabase[from][0]) : [];
                let toPairs = masterDatabase[to] ? (masterDatabase[to][chapterIdx] || masterDatabase[to][0]) : [];

                let combined = [];
                for (let i = 0; i < Math.min(fromPairs.length, toPairs.length); i++) {
                    let wordInNL = fromPairs[i][0];
                    let wordFrom = fromPairs[i][1];
                    let match = toPairs.find(p => p[0].toLowerCase() === wordInNL.toLowerCase());
                    let wordTo = match ? match[1] : fromPairs[i][1];
                    let allToOpts = toPairs.map(p => p[1]);
                    combined.push([wordFrom, wordTo, allToOpts]);
                }
                if (combined.length === 0) {
                    return [["Hello", "Bonjour", ["Bonjour", "Salut", "Adieu", "Merci"]]];
                }
                return combined;
            }
        }

        let activeQuestions = [], currentQIdx = 0, activeLessonIdx = 0, isCurrentExam = false;

        function startLesson(lessonIdx, isExam) {
            activeLessonIdx = lessonIdx;
            isCurrentExam = isExam;
            let fullWordList = getChapterWordList();
            activeQuestions = [];

            if(isExam) {
                let shuffledPool = [...fullWordList].sort(() => 0.5 - Math.random());
                let count = Math.min(10, shuffledPool.length);
                for(let q = 0; q < count; q++) {
                    let item = shuffledPool[q];
                    activeQuestions.push({ q: item[0], a: item[1], opts: item[2] });
                }
            } else {
                let chunkSize = 4;
                let startIndex = (lessonIdx * chunkSize) % fullWordList.length;
                for(let q = 0; q < 5; q++) {
                    let item = fullWordList[(startIndex + q) % fullWordList.length];
                    activeQuestions.push({ q: item[0], a: item[1], opts: item[2] });
                }
            }

            currentQIdx = 0;
            document.querySelectorAll('#page-dashboard, #page-lesson, #page-complete').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-lesson').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            if(currentQIdx >= activeQuestions.length) {
                appData.points += isCurrentExam ? 50 : 20;
                
                let langProgress = getCurrentLangCompletedMap();
                let key = `ch${appData.activeChapter}`;
                if(!langProgress[key]) langProgress[key] = [];
                if(!langProgress[key].includes(activeLessonIdx)) {
                    langProgress[key].push(activeLessonIdx);
                }
                saveData();
                updateDashboardStats();

                document.querySelectorAll('#page-dashboard, #page-lesson, #page-complete').forEach(p => p.classList.add('hidden'));
                document.getElementById('page-complete').classList.remove('hidden');
                return;
            }

            let qObj = activeQuestions[currentQIdx];
            let progressPercent = (currentQIdx / activeQuestions.length) * 100;
            document.getElementById('lesson-progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('lesson-progress-text').innerText = `${currentQIdx + 1}/${activeQuestions.length}`;
            
            document.getElementById('question-prompt').innerText = isCurrentExam 
                ? `${t("examPrompt")} "${qObj.q}"` 
                : `${t("lessonPrompt")} "${qObj.q}"`;

            let area = document.getElementById('answers-area');
            area.innerHTML = "";
            document.getElementById('next-btn').classList.add('hidden');

            let otherOpts = qObj.opts.filter(opt => opt.toLowerCase() !== qObj.a.toLowerCase());
            otherOpts.sort(() => 0.5 - Math.random());
            let shuffledOpts = [qObj.a, ...otherOpts.slice(0, 3)].sort(() => 0.5 - Math.random());

            shuffledOpts.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = "btn option-btn";
                btn.innerText = opt;
                btn.onclick = () => checkMcAnswer(opt, qObj.a);
                area.appendChild(btn);
            });
        }

        function checkMcAnswer(given, correct) {
            let area = document.getElementById('answers-area');
            area.querySelectorAll('button').forEach(b => b.disabled = true);

            if(given.toLowerCase() === correct.toLowerCase()) {
                area.innerHTML += `<div class="feedback-box-correct">${t("correctMsg")}</div>`;
            } else {
                area.innerHTML += `<div class="feedback-box-wrong">${t("wrongMsg")} <strong>${correct}</strong></div>`;
            }
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQIdx++;
            loadQuestion();
        }

        function backToDashboard() {
            updateDashboardStats();
            renderPath();
            document.querySelectorAll('#page-lesson, #page-complete').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-dashboard').classList.remove('hidden');
        }

        function resetProgressPrompt() {
            showNotification(t("resetTitle"), t("resetText"));
            let modalBtn = document.querySelector('.custom-modal .btn');
            modalBtn.onclick = function() {
                localStorage.removeItem('wordly_learn_v9');
                location.reload();
            };
        }

        function showNotification(title, text) {
            document.getElementById('notif-title').innerText = title;
            document.getElementById('notif-text').innerText = text;
            document.getElementById('custom-notification').classList.remove('hidden');
        }

        function closeNotification() {
            document.getElementById('custom-notification').classList.add('hidden');
        }
    </script>
