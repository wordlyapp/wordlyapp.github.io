<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly AI – Premium Language Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --success: #10b981;
            --success-light: #d1fae5;
            --error: #ef4444;
            --error-light: #fee2e2;
            --bg-main: #0f172a;
            --bg-surface: #1e293b;
            --bg-card: #26334d;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Navigation */
        header.top-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 36px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .logo-area {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-dot {
            width: 10px;
            height: 10px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--primary);
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Custom Dropdown UI met Vlaggen */
        .custom-dropdown-container {
            position: relative;
            user-select: none;
        }

        .dropdown-trigger {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
            transition: var(--transition);
        }

        .dropdown-trigger:hover {
            border-color: var(--primary);
            background: #2e3d59;
        }

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 200px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
            display: none;
            flex-direction: column;
            max-height: 260px;
            overflow-y: auto;
            z-index: 1000;
            padding: 6px;
        }

        .dropdown-menu.open {
            display: flex;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .dropdown-item:hover, .dropdown-item.active {
            background: var(--primary-light);
            color: var(--primary);
        }

        .flag-icon {
            width: 20px;
            height: 14px;
            border-radius: 3px;
            object-fit: cover;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .top-stats-bar {
            display: flex;
            gap: 10px;
        }

        .stat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .stat-pill span {
            color: var(--text-main);
        }

        .reset-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .reset-btn:hover { background: rgba(239, 68, 68, 0.2); }

        /* Workspace */
        main.workspace {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .content-container {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto;
        }

        /* Path View */
        .path-container-wrapper {
            width: 100%;
            text-align: center;
        }

        .dashboard-header {
            margin-bottom: 20px;
        }
        .dashboard-header h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
        .dashboard-header p { color: var(--text-muted); font-size: 13px; }

        .duo-path {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
            padding: 10px 0;
        }

        .path-row {
            display: flex;
            justify-content: center;
            width: 100%;
            gap: 50px;
        }

        .path-row.offset-1 { transform: translateX(-30px); }
        .path-row.offset-2 { transform: translateX(30px); }

        .duo-node {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            color: white;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
        }

        .duo-node span.node-label { font-size: 8px; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px; }

        .duo-node:hover:not(.locked) { transform: scale(1.08); background: var(--primary-hover); }
        .duo-node:active:not(.locked) { transform: scale(0.96); }

        .duo-node.locked {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            cursor: not-allowed;
            box-shadow: none;
        }

        .duo-node.current {
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.4);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(79, 70, 229, 0); }
            100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }

        /* Cards & Lesson View */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lesson-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .back-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .back-btn:hover { color: var(--text-main); border-color: var(--text-muted); }

        .progress-text {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .question-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-main);
            line-height: 1.4;
        }

        /* Buttons & Options */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: 700;
            border-radius: var(--radius-sm);
            cursor: pointer;
            width: 100%;
            margin-top: 14px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        .btn:active { transform: translateY(1px); }

        .option-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            margin: 8px 0;
            text-align: left;
            box-shadow: none;
            text-transform: none;
            font-weight: 600;
            font-size: 14px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
        }
        .option-btn:hover { background: #2e3d59; border-color: var(--primary); transform: translateX(2px); }

        /* Builder Elements */
        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
            padding: 12px;
            background: var(--bg-card);
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            min-height: 56px;
            align-content: flex-start;
        }

        .word-bubble {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }
        .word-bubble:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }

        .target-slot {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0;
            padding: 12px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            min-height: 56px;
            align-content: center;
        }

        /* Feedbacks */
        .feedback-box-correct {
            color: #34d399; font-weight: 700; font-size: 13px; margin: 10px 0; padding: 10px 14px;
            background: rgba(16, 185, 129, 0.1); border-radius: var(--radius-sm); border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .feedback-box-wrong {
            color: #f87171; font-weight: 700; font-size: 13px; margin: 10px 0; padding: 10px 14px;
            background: rgba(239, 68, 68, 0.1); border-radius: var(--radius-sm); border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .hidden { display: none !important; }

        /* Custom Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .custom-modal {
            background: var(--bg-surface);
            padding: 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .custom-modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 8px; color: var(--text-main); }
        .custom-modal p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- Notification Modal -->
    <div id="custom-notification" class="modal-overlay hidden">
        <div class="custom-modal">
            <h3 id="notif-title">Melding</h3>
            <p id="notif-text">Tekst...</p>
            <button class="btn" onclick="closeNotification()" style="margin-top: 0;">Begrepen</button>
        </div>
    </div>

    <!-- Top Nav -->
    <header class="top-nav">
        <div class="logo-area">
            <div class="logo-dot"></div>
            Wordly AI
        </div>
        <div class="nav-controls">
            <!-- Custom Language Selector met vlaggen via vlaggen-afbeeldingen -->
            <div class="custom-dropdown-container" id="lang-dropdown">
                <div class="dropdown-trigger" onclick="toggleDropdown()">
                    <img id="current-flag" class="flag-icon" src="" alt="">
                    <span id="current-lang-name">Selecteer taal</span>
                </div>
                <div class="dropdown-menu" id="dropdown-options">
                    <!-- Wordt dynamisch gevuld met vlaggen -->
                </div>
            </div>

            <div class="top-stats-bar">
                <div class="stat-pill">Niveau: <span id="difficulty-display">1</span></div>
                <div class="stat-pill">XP: <span id="points-display">0</span></div>
                <div class="stat-pill">Streak: <span id="streak-display">1</span></div>
            </div>
            <button class="reset-btn" onclick="resetProgressPrompt()">Reset</button>
        </div>
    </header>

    <!-- Workspace -->
    <main class="workspace">
        <div class="content-container">

            <!-- Dashboard / Leerpad -->
            <div id="page-dashboard" class="path-container-wrapper">
                <div class="dashboard-header">
                    <h2>Adaptief Leerpad</h2>
                    <p>De AI past het niveau automatisch aan op basis van jouw prestaties.</p>
                </div>
                <div class="duo-path" id="path-container"></div>
            </div>

            <!-- Lessen / Vragen Scherm -->
            <div id="page-lesson" class="card page-section hidden">
                <div class="lesson-top-bar">
                    <button class="back-btn" onclick="backToDashboard()">Afbreken</button>
                    <span id="lesson-progress-text" class="progress-text">Vraag 1 van 6</span>
                </div>
                <h3 id="question-prompt" class="question-title">Vertaal dit</h3>
                
                <div id="answers-area"></div>
                
                <button id="next-btn" class="btn hidden" onclick="nextQuestion()">Doorgaan</button>
            </div>

            <!-- Voltooid Scherm -->
            <div id="page-complete" class="card page-section hidden" style="text-align: center;">
                <h2 style="font-size: 22px; font-weight: 800; color: #34d399; margin-bottom: 8px;">Les Voltooid</h2>
                <p id="complete-text" style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">Uitstekend gepresteerd.</p>
                <button class="btn" onclick="backToDashboard()">Doorgaan</button>
            </div>

        </div>
    </main>

    <script>
        const languages = [
            { code: "en", name: "Engels", flag: "https://flagcdn.com/w40/gb.png" },
            { code: "de", name: "Duits", flag: "https://flagcdn.com/w40/de.png" },
            { code: "es", name: "Spaans", flag: "https://flagcdn.com/w40/es.png" },
            { code: "fr", name: "Frans", flag: "https://flagcdn.com/w40/fr.png" },
            { code: "it", name: "Italiaans", flag: "https://flagcdn.com/w40/it.png" },
            { code: "pt", name: "Portugees", flag: "https://flagcdn.com/w40/pt.png" },
            { code: "ru", name: "Russisch", flag: "https://flagcdn.com/w40/ru.png" },
            { code: "ja", name: "Japans", flag: "https://flagcdn.com/w40/jp.png" },
            { code: "zh", name: "Chinees", flag: "https://flagcdn.com/w40/cn.png" },
            { code: "tr", name: "Turks", flag: "https://flagcdn.com/w40/tr.png" },
            { code: "sv", name: "Zweeds", flag: "https://flagcdn.com/w40/se.png" },
            { code: "no", name: "Noors", flag: "https://flagcdn.com/w40/no.png" },
            { code: "da", name: "Deens", flag: "https://flagcdn.com/w40/dk.png" },
            { code: "pl", name: "Pools", flag: "https://flagcdn.com/w40/pl.png" }
        ];

        function toggleDropdown() {
            document.getElementById('dropdown-options').classList.toggle('open');
        }

        window.onclick = function(event) {
            if (!document.getElementById('lang-dropdown').contains(event.target)) {
                document.getElementById('dropdown-options').classList.remove('open');
            }
        }

        function initLanguageSelector() {
            let menu = document.getElementById('dropdown-options');
            menu.innerHTML = "";
            languages.forEach(l => {
                let item = document.createElement('div');
                item.className = `dropdown-item ${appData.targetLang === l.code ? 'active' : ''}`;
                item.innerHTML = `<img class="flag-icon" src="${l.flag}" alt="${l.name}"> <span>${l.name}</span>`;
                item.onclick = () => {
                    appData.targetLang = l.code;
                    saveData();
                    updateLanguageDisplay();
                    renderPath();
                    toggleDropdown();
                };
                menu.appendChild(item);
            });
            updateLanguageDisplay();
        }

        function updateLanguageDisplay() {
            let current = languages.find(l => l.code === appData.targetLang) || languages[0];
            document.getElementById('current-flag').src = current.flag;
            document.getElementById('current-lang-name').innerText = current.name;
        }

        function showNotification(title, text) {
            document.getElementById('notif-title').innerText = title;
            document.getElementById('notif-text').innerText = text;
            document.getElementById('custom-notification').classList.remove('hidden');
        }

        function closeNotification() {
            document.getElementById('custom-notification').classList.add('hidden');
        }

        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else {
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                }
            } catch(e) {}
        }

        const vocabData = {
            en: [
                { nl: "Hallo", target: "Hello", grammar: "Groet", type: "vocab" },
                { nl: "Goedemorgen", target: "Good morning", grammar: "Groet", type: "vocab" },
                { nl: "Hoe gaat het met jou?", target: "How are you doing today?", grammar: "Zinnen", type: "builder" },
                { nl: "Ik hou heel erg van programmeren", target: "I love programming very much", grammar: "Zinnen", type: "builder" },
                { nl: "Waar is het dichtstbijzijnde station?", target: "Where is the nearest station?", grammar: "Reizen", type: "builder" },
                { nl: "Kies de correcte verleden tijd van 'to go':", target: "went", options: ["goed", "gone", "went", "going"], grammar: "Grammatica", type: "mc" }
            ],
            de: [
                { nl: "Hallo", target: "Hallo", grammar: "Groet", type: "vocab" },
                { nl: "Goedemorgen", target: "Guten Morgen", grammar: "Groet", type: "vocab" },
                { nl: "Hoe gaat het met jou?", target: "Wie geht es dir heute?", grammar: "Zinnen", type: "builder" },
                { nl: "Waar is het treinstation?", target: "Wo ist der Bahnhof?", grammar: "Reizen", type: "builder" }
            ],
            es: [
                { nl: "Hallo", target: "Hola", grammar: "Groet", type: "vocab" },
                { nl: "Goedemorgen", target: "Buenos días", grammar: "Groet", type: "vocab" },
                { nl: "Hoe gaat het?", target: "¿Cómo estás hoy?", grammar: "Zinnen", type: "builder" }
            ],
            fr: [
                { nl: "Hallo", target: "Bonjour", grammar: "Groet", type: "vocab" },
                { nl: "Hoe gaat het?", target: "Comment ça va?", grammar: "Zinnen", type: "builder" }
            ],
            it: [ { nl: "Hallo", target: "Ciao", grammar: "Groet", type: "vocab" } ],
            pt: [ { nl: "Hallo", target: "Olá", grammar: "Groet", type: "vocab" } ],
            ru: [ { nl: "Hallo", target: "Привет", grammar: "Groet", type: "vocab" } ],
            ja: [ { nl: "Hallo", target: "こんにちは", grammar: "Groet", type: "vocab" } ],
            zh: [ { nl: "Hallo", target: "你好", grammar: "Groet", type: "vocab" } ],
            tr: [ { nl: "Hallo", target: "Merhaba", grammar: "Groet", type: "vocab" } ],
            sv: [ { nl: "Hallo", target: "Hej", grammar: "Groet", type: "vocab" } ],
            no: [ { nl: "Hallo", target: "Hei", grammar: "Groet", type: "vocab" } ],
            da: [ { nl: "Hallo", target: "Hej", grammar: "Groet", type: "vocab" } ],
            pl: [ { nl: "Hallo", target: "Cześć", grammar: "Groet", type: "vocab" } ]
        };

        let appData = JSON.parse(localStorage.getItem('wordly_ai_central_v3')) || {
            points: 0,
            streak: 1,
            difficulty: 1,
            perfectStreak: 0,
            completed: {},
            targetLang: "en"
        };

        function saveData() {
            localStorage.setItem('wordly_ai_central_v3', JSON.stringify(appData));
        }

        window.onload = function() {
            initLanguageSelector();
            updateDashboardStats();
            renderPath();
        };

        function updateDashboardStats() {
            document.getElementById('points-display').innerText = appData.points;
            document.getElementById('streak-display').innerText = appData.streak;
            document.getElementById('difficulty-display').innerText = appData.difficulty;
        }

        function generateAdaptiveLessons() {
            let list = vocabData[appData.targetLang] || vocabData.en;
            const lessons = [];
            let totalLessonsCount = 10;

            for(let i = 1; i <= totalLessonsCount; i++) {
                let qList = [];
                let questionCount = 4 + Math.min(appData.difficulty, 3);

                for(let q = 0; q < questionCount; q++) {
                    let baseItem = list[(i + q) % list.length];
                    let typeChoice = (q % 2 === 0 && baseItem.target.includes(" ")) ? "builder" : "mc";

                    if(typeChoice === "builder") {
                        let words = baseItem.target.split(" ");
                        let shuffledWords = [...words].sort(() => 0.5 - Math.random());
                        qList.push({
                            type: "builder",
                            prompt: `Vertaal de zin: "${baseItem.nl}"`,
                            correctWords: words,
                            shuffledWords: shuffledWords,
                            grammar: baseItem.grammar
                        });
                    } else {
                        let wrongOpts = list.filter(x => x.target !== baseItem.target).sort(() => 0.5 - Math.random()).slice(0, 3).map(x => x.target);
                        if(baseItem.options) wrongOpts = [...baseItem.options];
                        if(!wrongOpts.includes(baseItem.target)) wrongOpts.push(baseItem.target);
                        wrongOpts.sort(() => 0.5 - Math.random());
                        
                        qList.push({
                            type: "mc",
                            prompt: baseItem.options ? baseItem.nl : `Vertaal: "${baseItem.nl}"`,
                            correct: baseItem.target,
                            options: wrongOpts,
                            grammar: baseItem.grammar
                        });
                    }
                }

                lessons.push({
                    id: `lesson_${appData.targetLang}_${i}`,
                    title: `${i}`,
                    questions: qList
                });
            }
            return lessons;
        }

        function renderPath() {
            let container = document.getElementById('path-container');
            container.innerHTML = "";
            let lessons = generateAdaptiveLessons();
            let pattern = [1, 2, 1, 2];
            let idx = 0, pIdx = 0;
            let langCompleted = appData.completed[appData.targetLang] || [];

            while(idx < lessons.length) {
                let count = pattern[pIdx % pattern.length];
                let row = document.createElement('div');
                row.className = `path-row offset-${pIdx % 3}`;

                for(let i = 0; i < count && idx < lessons.length; i++) {
                    let les = lessons[idx];
                    let isDone = langCompleted.includes(les.id);
                    let isUnlocked = idx === 0 || langCompleted.includes(lessons[idx-1].id);

                    let node = document.createElement('button');
                    node.className = `duo-node ${isDone ? 'done' : (!isUnlocked ? 'locked' : 'current')}`;
                    if(isDone) node.style.background = "#10b981";
                    node.innerHTML = `${les.title}<span class="node-label">Les</span>`;
                    
                    if(isUnlocked) {
                        node.onclick = () => startLesson(les.id, lessons);
                    }

                    row.appendChild(node);
                    idx++;
                }
                container.appendChild(row);
                pIdx++;
            }
        }

        let activeQuestions = [], currentQIdx = 0, activeLesId = "", currentLessonErrors = 0;
        function startLesson(id, allLessons) {
            activeLesId = id;
            let lesObj = allLessons.find(l => l.id === id);
            activeQuestions = lesObj.questions;
            currentQIdx = 0;
            currentLessonErrors = 0;
            document.querySelectorAll('#page-dashboard, #page-lesson, #page-complete').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-lesson').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            if(currentQIdx >= activeQuestions.length) {
                appData.points += 25;
                if(!appData.completed[appData.targetLang]) appData.completed[appData.targetLang] = [];
                if(!appData.completed[appData.targetLang].includes(activeLesId)) {
                    appData.completed[appData.targetLang].push(activeLesId);
                }

                let messageExtra = "";
                if(currentLessonErrors === 0) {
                    appData.perfectStreak++;
                    if(appData.perfectStreak >= 2) {
                        appData.difficulty++;
                        appData.perfectStreak = 0;
                        messageExtra = ` Foutloze reeks behaald! Niveau verhoogd naar ${appData.difficulty}.`;
                    } else {
                        messageExtra = ` Foutloze les afgerond.`;
                    }
                } else {
                    appData.perfectStreak = 0;
                    messageExtra = ` Les voltooid met ${currentLessonErrors} fout(en).`;
                }

                saveData();
                updateDashboardStats();
                initLanguageSelector();

                document.querySelectorAll('#page-dashboard, #page-lesson, #page-complete').forEach(p => p.classList.add('hidden'));
                document.getElementById('page-complete').classList.remove('hidden');
                document.getElementById('complete-text').innerText = messageExtra;
                return;
            }

            let q = activeQuestions[currentQIdx];
            document.getElementById('lesson-progress-text').innerText = `Vraag ${currentQIdx + 1} van ${activeQuestions.length}`;
            document.getElementById('question-prompt').innerText = q.prompt;

            let area = document.getElementById('answers-area');
            area.innerHTML = "";
            document.getElementById('next-btn').classList.add('hidden');

            if(q.type === 'mc') {
                q.options.forEach(opt => {
                    let btn = document.createElement('button');
                    btn.className = "btn option-btn";
                    btn.innerText = opt;
                    btn.onclick = () => checkMcAnswer(opt, q.correct);
                    area.appendChild(btn);
                });
            } else if(q.type === 'builder') {
                renderSentenceBuilder(q);
            }
        }

        function renderSentenceBuilder(q) {
            let area = document.getElementById('answers-area');
            let selectedWords = [];

            area.innerHTML = `
                <div style="font-size:12px; color:var(--text-muted); margin-bottom:4px; font-weight:600;">Jouw zin:</div>
                <div id="target-slot" class="target-slot"></div>
                <div style="font-size:12px; color:var(--text-muted); margin-bottom:4px; margin-top:12px; font-weight:600;">Beschikbare woorden:</div>
                <div id="word-bank" class="word-bank"></div>
                <div id="builder-feedback"></div>
            `;

            let slotDiv = document.getElementById('target-slot');
            let bankDiv = document.getElementById('word-bank');

            function updateUI() {
                slotDiv.innerHTML = "";
                bankDiv.innerHTML = "";

                if(selectedWords.length === 0) {
                    slotDiv.innerHTML = `<span style="color:var(--text-muted); font-size:12px; font-style:italic;">Selecteer woorden om de zin te bouwen...</span>`;
                }

                selectedWords.forEach((item, idx) => {
                    let bubble = document.createElement('div');
                    bubble.className = "word-bubble";
                    bubble.style.borderColor = "var(--primary)";
                    bubble.style.background = "var(--primary-light)";
                    bubble.style.color = "var(--primary)";
                    bubble.innerText = item.word;
                    bubble.onclick = () => {
                        selectedWords.splice(idx, 1);
                        updateUI();
                    };
                    slotDiv.appendChild(bubble);
                });

                q.shuffledWords.forEach((w, idx) => {
                    let usedCount = selectedWords.filter(s => s.originalIdx === idx).length;
                    if(usedCount === 0) {
                        let bubble = document.createElement('div');
                        bubble.className = "word-bubble";
                        bubble.innerText = w;
                        bubble.onclick = () => {
                            selectedWords.push({ word: w, originalIdx: idx });
                            updateUI();
                        };
                        bankDiv.appendChild(bubble);
                    }
                });
            }

            updateUI();

            let checkBtn = document.createElement('button');
            checkBtn.className = "btn";
            checkBtn.innerText = "Controleer";
            checkBtn.style.marginTop = "12px";
            checkBtn.onclick = () => {
                let userSentence = selectedWords.map(s => s.word).join(" ");
                let correctSentence = q.correctWords.join(" ");

                if(userSentence.toLowerCase() === correctSentence.toLowerCase()) {
                    playSound('correct');
                    document.getElementById('builder-feedback').innerHTML = `<div class="feedback-box-correct">Correct</div>`;
                    checkBtn.classList.add('hidden');
                    document.getElementById('next-btn').classList.remove('hidden');
                } else {
                    playSound('wrong');
                    currentLessonErrors++;
                    document.getElementById('builder-feedback').innerHTML = `<div class="feedback-box-wrong">Onjuist. Juist was: ${correctSentence}</div>`;
                    checkBtn.classList.add('hidden');
                    document.getElementById('next-btn').classList.remove('hidden');
                }
            };
            area.appendChild(checkBtn);
        }

        function checkMcAnswer(given, correct) {
            let area = document.getElementById('answers-area');
            area.querySelectorAll('button').forEach(b => b.disabled = true);

            if(given.toLowerCase() === correct.toLowerCase()) {
                playSound('correct');
                area.innerHTML += `<div class="feedback-box-correct">Correct</div>`;
            } else {
                playSound('wrong');
                currentLessonErrors++;
                area.innerHTML += `<div class="feedback-box-wrong">Onjuist. Juist was: ${correct}</div>`;
            }
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQIdx++;
            loadQuestion();
        }

        function backToDashboard() {
            updateDashboardStats();
            renderPath();
            initLanguageSelector();
            document.querySelectorAll('#page-lesson, #page-complete').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-dashboard').classList.remove('hidden');
        }

        function resetProgressPrompt() {
            showNotification("Voortgang wissen", "Weet je zeker dat je alle opgeslagen gegevens wilt resetten?");
            let modalBtn = document.querySelector('.custom-modal .btn');
            modalBtn.onclick = function() {
                localStorage.removeItem('wordly_ai_central_v3');
                location.reload();
            };
        }
    </script>
</body>
</html>
