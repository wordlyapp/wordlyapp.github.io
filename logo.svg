<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Achtergrond en schaduw effecten -->
    <filter id="globeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="0" flood-color="#3b8201" flood-opacity="1"/>
    </filter>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58cc02" />
      <stop offset="100%" stop-color="#46a302" />
    </linearGradient>
  </defs>

  <!-- Wereldbol achtergrond -->
  <circle cx="250" cy="230" r="150" fill="url(#globeGrad)" filter="url(#globeShadow)" />

  <!-- Wereldbol raster / meridianen voor het 'wereld' gevoel -->
  <circle cx="250" cy="230" r="150" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.2" />
  <path d="M 100 230 Q 250 120 400 230" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.3" />
  <path d="M 100 230 Q 250 340 400 230" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.3" />
  <path d="M 160 95 Q 250 230 160 365" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.3" />
  <path d="M 340 95 Q 250 230 340 365" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.3" />

  <!-- Overlay tekst "Wordly" gecentreerd op de wereld -->
  <text x="250" y="248" font-family="'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1" filter="url(#globeShadow)">
    Wordly
  </text>
</svg>
