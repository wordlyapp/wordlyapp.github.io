name: Build Wordly Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        run: npm run build -- --publish never

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Wordly-Windows
          path: dist/*.exe
